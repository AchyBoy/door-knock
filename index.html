<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="x-knock-version" content="v1.19">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Door Knocking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --ink:#1b1b1f; --dim:#6b6b76; --card:#fff; --line:#e3e3e8; --brand:#1f4fd1;
         --noans:#e8a317; --noint:#e5534b; --yes:#24a35f; --back:#3b82f6 }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%}
  #map{position:fixed; inset:0}
  button{font:inherit; cursor:pointer}

  /* top bar: the map's name and the counts */
  .top{position:fixed; top:0; left:0; right:0; z-index:500; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
       background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(8px)}
  .top .row{display:flex; align-items:center; gap:8px}
  .title{font-weight:700; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:0; background:none; text-align:left; padding:2px 0}
  .me{border:1px solid var(--line); background:#f4f4f7; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:600; white-space:nowrap}
  .counts{display:flex; gap:6px; margin-top:6px; overflow-x:auto; scrollbar-width:none}
  .counts::-webkit-scrollbar{display:none}
  .chip{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; white-space:nowrap;
        background:#f4f4f7; border-radius:999px; padding:4px 9px}
  .dot{width:10px; height:10px; border-radius:50%; flex:0 0 10px; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .sync{font-size:11.5px; color:var(--dim); white-space:nowrap}

  /* bottom bar */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:500; display:flex; gap:8px;
       padding:8px 10px calc(env(safe-area-inset-bottom) + 10px); background:rgba(255,255,255,.94);
       border-top:1px solid var(--line); backdrop-filter:blur(8px)}
  .bar button{flex:1; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 4px; font-size:14px; font-weight:600}
  .bar button.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
  .fab{position:fixed; right:10px; z-index:500; width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
       background:#fff; font-size:19px; box-shadow:0 2px 8px rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center}

  .goto{position:fixed; left:10px; right:10px; z-index:540; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
        border-radius:12px; padding:10px 13px; font-size:15px; color:var(--dim); box-shadow:0 2px 8px rgba(0,0,0,.14); cursor:pointer}
  .fbar{position:fixed; left:10px; right:10px; z-index:550; display:none; align-items:center; gap:8px; background:#1f4fd1; color:#fff;
        border-radius:12px; padding:9px 12px; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .fbar span{flex:1}
  .fbar button{border:0; background:rgba(255,255,255,.22); color:#fff; border-radius:8px; padding:6px 10px; font-weight:700}
  .fchips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px}
  .fchips button{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:5px}
  .fchips button.on{background:#1b1b1f; color:#fff; border-color:#1b1b1f}
  mark{background:#ffe58a; color:inherit; border-radius:3px; padding:0 1px}
  .hint{position:fixed; left:50%; transform:translateX(-50%); z-index:600; background:rgba(20,20,26,.88); color:#fff;
        font-size:13.5px; padding:8px 13px; border-radius:10px; max-width:92vw; text-align:center; pointer-events:none}

  /* bottom sheet */
  .scrim{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.28); display:none}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:901; background:var(--card); border-radius:18px 18px 0 0;
         padding:14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:86vh; overflow-y:auto; display:none;
         box-shadow:0 -6px 24px rgba(0,0,0,.18); max-width:620px; margin:0 auto}
  .sheet.on, .scrim.on{display:block}
  .sheet h3{margin:0 0 2px; font-size:18px}
  .sheet .sub{color:var(--dim); font-size:13px; margin-bottom:12px}
  .sheet label{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:12px 0 5px}
  .sheet input[type=text], .sheet textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font:inherit; font-size:16px; background:#fafafc}
  .sheet textarea{min-height:66px; resize:vertical}
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .stat button{border:2px solid var(--line); background:#fff; border-radius:12px; padding:13px 6px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px}
  .stat button.on{color:#fff}
  .acts{display:flex; gap:8px; margin-top:16px}
  .acts button{flex:1; border-radius:12px; padding:13px; font-size:15px; font-weight:700; border:1px solid var(--line); background:#fff}
  .acts .save{background:var(--brand); color:#fff; border-color:var(--brand)}
  .acts .del{flex:0 0 auto; color:var(--noint)}
  .log{margin:12px 0 0; padding:0; list-style:none; font-size:13px; color:var(--dim)}
  .log li{padding:5px 0; border-top:1px solid var(--line)}
  .log li:first-child{border-top:0}
  .log .lh{display:flex; gap:7px; align-items:center}
  .log .ln{margin:3px 0 0 17px; color:var(--ink); white-space:pre-wrap}
  .turf{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 8px; display:flex; align-items:center; gap:10px}
  .turf .sw{width:14px; height:14px; border-radius:4px; flex:0 0 14px}
  .turf .t{flex:1; min-width:0}
  .turf .t b{display:block; font-size:15px}
  .turf .t span{font-size:12.5px; color:var(--dim)}
  .turf button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 10px; font-size:13px; font-weight:600}
  .wk{display:flex; align-items:center; gap:8px; margin:4px 0 6px}
  .wk b{flex:1; text-align:center; font-size:15px}
  .wk button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px; font-size:15px; font-weight:700}
  .rrow{display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px}
  .rrow:first-of-type{border-top:0}
  .rrow .n{flex:1; min-width:0}
  .rrow .n span{display:block; font-size:12.5px; color:var(--dim); white-space:pre-wrap}
  .rrow .c{font-weight:700; white-space:nowrap}
  .tap{cursor:pointer}
  .sheet select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font:inherit; font-size:16px; background:#fafafc}
  .empty{color:var(--dim); font-size:14px; padding:6px 0 4px}
  .vtx{background:#fff; border:3px solid #1f4fd1; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .vtx.new{background:#1f4fd1}
  .pick{display:flex; flex-wrap:wrap; gap:7px}
  .pick button{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font-size:14.5px; font-weight:600}
  .pick button.on{background:#1f4fd1; border-color:#1f4fd1; color:#fff}
  .qd{border:1px solid var(--line); background:#fff; border-radius:9px; padding:9px 8px; font-size:13px; font-weight:600; white-space:nowrap}
  .fixed{border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:16px; background:#f4f4f7; color:var(--dim)}
  .leaflet-tooltip.turf-lbl{background:rgba(255,255,255,.9); border:0; box-shadow:0 1px 4px rgba(0,0,0,.25); font-weight:700; font-size:12px; padding:3px 7px}
  .leaflet-tooltip.turf-lbl:before{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="row">
    <button class="title" id="title">Door Knocking</button>
    <span class="sync" id="sync"></span>
    <button class="me" id="me">You: ?</button>
  </div>
  <div class="counts" id="counts"></div>
</div>

<button class="fab" id="locate" title="Where am I">◎</button>
<button class="fab" id="layer" title="Satellite or street map">🗺️</button>
<button class="fab" id="searchBtn" title="Search houses" style="display:none">🔍</button>
<div class="goto" id="goto">🔎 <span>Find an address or place</span></div>
<div class="fbar" id="fbar"><span id="fbarText"></span><button id="fbarList">List</button><button id="fbarClear">✕ Clear</button></div>

<div class="hint" id="hint" style="display:none"></div>

<div class="bar" id="bar">
  <button id="drawBtn">✏️ Draw turf</button>
  <button id="turfsBtn">Turfs</button>
  <button id="shareBtn">Share link</button>
  <button id="reportBtn" style="display:none">Report</button>
</div>
<div class="bar" id="drawBar" style="display:none">
  <button id="undoPt">Undo</button>
  <button id="cancelDraw">Cancel</button>
  <button id="finishDraw" class="primary">Finish</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var API = 'https://api.jobhubgo.com/api/knock/';

  var STATUSES = [
    { k:'noans', label:'No answer',      color:'#e8a317' },
    { k:'noint', label:'Not interested', color:'#e5534b' },
    { k:'yes',   label:'Interested',     color:'#24a35f' },
    { k:'back',  label:'Come back',      color:'#3b82f6' },
    { k:'dnk',   label:'Do not knock',   color:'#111827' },
    { k:'vac',   label:'Vacant / not a house', color:'#64748b' }
  ];
  // After Interested, the leader's follow-up; never set by the worker.
  var FOLLOW = [
    { k:'',        label:'Not yet' },
    { k:'called',  label:'Called' },
    { k:'visited', label:'Visited' },
    { k:'study',   label:'Bible study' },
    { k:'church',  label:'Came to church' },
    { k:'noreach', label:'Could not reach' }
  ];
  var FOL = {}; FOLLOW.forEach(function(f){ FOL[f.k] = f; });
  var STAT = {}; STATUSES.forEach(function(s){ STAT[s.k] = s; });
  var TURF_COLORS = ['#8b5cf6','#ec4899','#f97316','#14b8a6','#0ea5e9','#84cc16','#a855f7','#ef4444'];

  // ---- which map: the key rides in the link, like the YAM sheet --------------
  function rid(n){ var a='abcdefghijkmnpqrstuvwxyz23456789', s=''; for(var i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
  // 🔴 Links carry the map and team in the QUERY (?m=..&t=..). They used to ride
  // after the #, and a team link texted to Lizzy arrived without its team. The
  // # part is the first thing a share or a messaging app throws away; the query
  // never is. Old # links are still read, decoded, for anyone who has one.
  function linkArg(k){
    var q = new URLSearchParams(location.search).get(k);
    if (q) return q.toLowerCase().replace(/[^a-z0-9_-]/g, '');
    var h = location.hash;
    try { h = decodeURIComponent(h); } catch(e){}
    var x = new RegExp('[#&?;]' + k + '=([a-z0-9_-]+)', 'i').exec(h.replace(/&amp;/g, '&'));
    return x ? x[1].toLowerCase() : '';
  }
  var MAP = linkArg('m') || localStorage.getItem('knock-last-map') || rid(10);
  if (!linkArg('m')) history.replaceState(null, '', location.pathname + '?m=' + MAP);
  localStorage.setItem('knock-last-map', MAP);

  // Who you are on this map rides in the link too, and sticks on the phone:
  //   &t=<team>              a worker on that leader's team (the team link)
  //   &t=<team>&L=<key>      that team's leader, sees the team's report
  //   &p=<key>               the pastor, sees every team and sets up leaders
  // Workers never pick anything; the link their leader sent does it.
  var K_TEAM = 'knock-team-' + MAP, K_LEAD = 'knock-lead-' + MAP, K_PASTOR = 'knock-pastor-' + MAP;
  if (linkArg('t')) { localStorage.setItem(K_TEAM, linkArg('t')); if (!linkArg('L')) localStorage.removeItem(K_LEAD); }
  if (linkArg('L')) localStorage.setItem(K_LEAD, linkArg('L'));
  if (linkArg('p')) localStorage.setItem(K_PASTOR, linkArg('p'));
  var myTeam = localStorage.getItem(K_TEAM) || '';
  var myLead = localStorage.getItem(K_LEAD) || '';
  var myPastor = localStorage.getItem(K_PASTOR) || '';
  // 🔴 Safari opens a link to this page in the tab ALREADY on it and only swaps
  // the #part, without reloading, so a new team link was never read and the
  // worker stayed off the team. Any new link reloads.
  window.addEventListener('hashchange', function(){ location.reload(); });

  var K_ITEMS = 'knock-items-' + MAP, K_PEND = 'knock-pend-' + MAP, K_SINCE = 'knock-since-' + MAP;
  function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  var items = load(K_ITEMS, {});          // id -> { id, kind, data, updatedAt, deleted }
  var pending = load(K_PEND, {});         // id -> true, written here and not yet on the server
  var since = load(K_SINCE, 0);
  // A personal link can carry the person's name (&n=Amy%20Hebert), so they never
  // type it. The link wins over whatever this phone had.
  var linkName = (new URLSearchParams(location.search).get('n') || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (linkName) localStorage.setItem('knock-name', linkName);
  var myName = localStorage.getItem('knock-name') || '';
  function persist(){
    try { localStorage.setItem(K_ITEMS, JSON.stringify(items)); localStorage.setItem(K_PEND, JSON.stringify(pending)); } catch(e){}
  }

  // ---- the activity log: who did what, when ------------------------------------
  // Every action goes in a queue on the phone and is sent in batches, so a dead
  // signal loses nothing. Nobody is asked anything; it only records.
  var K_EVQ = 'knock-evq-' + MAP, evq = load(K_EVQ, []), evBusy = false;
  function track(kind, data){
    evq.push({ at:Date.now(), who:myName || '', team:teamOf(myTeam) ? myTeam : '',
      role:isPastor() ? 'pastor' : isLeader() ? 'leader' : 'worker', kind:kind, data:data || {} });
    if (evq.length > 800) evq = evq.slice(-800);
    evCache = {};   // anything this phone just did must show in the next Activity look
    try { localStorage.setItem(K_EVQ, JSON.stringify(evq)); } catch(e){}
    flushEvents();
  }
  function flushEvents(){
    if (evBusy || !evq.length) return;
    evBusy = true;
    var batch = evq.slice(0, 50);
    fetch(API + MAP + '/events', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ events:batch }) })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(){
        evq.splice(0, batch.length);
        try { localStorage.setItem(K_EVQ, JSON.stringify(evq)); } catch(e){}
        evBusy = false; if (evq.length) flushEvents();
      })
      .catch(function(){ evBusy = false; });
  }

  function teamOf(id){ var t = id && items[id]; return t && t.kind === 'team' && !t.deleted ? t : null; }
  function teamName(id){ var t = teamOf(id); return t ? t.data.name : 'No team'; }
  function isPastor(){ var a = items.access; return !!(myPastor && a && !a.deleted && a.data.pastorKey === myPastor); }
  function isLeader(){ var t = teamOf(myTeam); return !!(myLead && t && t.data.leaderKey === myLead); }
  var BASE = location.origin + location.pathname + '?m=' + MAP;

  // 🔴 Who you are lives in THIS browser's storage, and every browser has its own
  // (the one Messages opens is not Safari). So the address bar always carries
  // your whole link: a bookmark, a Home Screen icon, history or a reopened tab
  // brings the leader back as the leader. Invite team still sends the worker link.
  // ...and the name too, typed or from the link, so the address bar IS this
  // person's own link: a Home Screen icon opens as them in any browser.
  function setAddressBar(){
    history.replaceState(null, '', location.pathname + '?m=' + MAP +
      (myTeam ? '&t=' + myTeam : '') + (myLead ? '&L=' + myLead : '') + (myPastor ? '&p=' + myPastor : '') +
      (myName ? '&n=' + encodeURIComponent(myName) : ''));
  }
  setAddressBar();

  // Each phone on a team checks in by itself, so a leader sees who has joined
  // before they mark a single door. The worker does nothing; it is one row per
  // phone, refreshed at most every few hours.
  var K_MEMBER = 'knock-member-' + MAP;
  var memberId = localStorage.getItem(K_MEMBER) || ('mb' + rid(10));
  localStorage.setItem(K_MEMBER, memberId);
  function checkIn(){
    if (!myName || !teamOf(myTeam)) return;
    var cur = items[memberId], d = cur && !cur.deleted ? cur.data : null;
    if (d && d.team === myTeam && d.name === myName && !!d.lead === isLeader() && Date.now() - d.seen < 4 * 3600e3) return;
    save({ id:memberId, kind:'member', data:{ name:myName, team:myTeam, lead:isLeader(), seen:Date.now() } });
  }
  function teamLink(t){ return BASE + '&t=' + t.id; }
  function personLink(teamId, name){ return BASE + '&t=' + teamId + '&n=' + encodeURIComponent(name); }
  function leaderLink(t){ return BASE + '&t=' + t.id + '&L=' + t.data.leaderKey + '&n=' + encodeURIComponent(t.data.name); }

  // ---- map ----------------------------------------------------------------------
  var map = L.map('map', { zoomControl:false, attributionControl:true, maxZoom:21 });
  var street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:21, maxNativeZoom:19, attribution:'© OpenStreetMap'
  });
  var sat = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:21, maxNativeZoom:19, attribution:'Imagery © Esri'
    }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:21, maxNativeZoom:19
    })
  ]);
  var useSat = localStorage.getItem('knock-layer') !== 'street';
  (useSat ? sat : street).addTo(map);
  function setLayerIcon(){ $('layer').textContent = useSat ? '🗺️' : '🛰️'; }

  // pins on their own pane so a turf's shading never sits over a house
  map.createPane('pins').style.zIndex = 450;
  var pinLayer = L.layerGroup().addTo(map);

  // ---- the houses: a grey dot on every door not yet knocked --------------------
  // Lafayette and Iberia come from the parishes' own address points (with the
  // address); St. Martin and Vermilion from Microsoft roofs (address filled on
  // tap). Fetched a ~1 km cell at a time, kept for the session.
  // 🔴 The cells are plain files beside this page (houses/<y>_<x>.json), NOT the
  // JobHub database: loading 190k houses there pushed its disk to 90% full.
  map.createPane('houses').style.zIndex = 440;
  var houseRenderer = L.canvas({ pane:'houses' });
  var houseLayer = L.layerGroup().addTo(map);
  var houses = {}, houseCell = {}, cellState = {}, CELL = 0.01;
  function cellKey(lat, lng){ return Math.floor(lat / CELL) + ':' + Math.floor(lng / CELL); }
  function cellsFor(b){
    var out = [];
    for (var y = Math.floor(b.getSouth() / CELL); y <= Math.floor(b.getNorth() / CELL); y++)
      for (var x = Math.floor(b.getWest() / CELL); x <= Math.floor(b.getEast() / CELL); x++) out.push(y + ':' + x);
    return out;
  }
  // resolves true when it brought in cells that were not here before
  function loadCells(b){
    var want = cellsFor(b).filter(function(k){ return !cellState[k]; });
    if (!want.length || want.length > 40) return Promise.resolve(false);
    return Promise.all(want.map(function(k){
      cellState[k] = 'loading';
      return fetch('houses/' + k.replace(':', '_') + '.json')
        .then(function(r){ if (r.status === 404) return []; if (!r.ok) throw new Error('http ' + r.status); return r.json(); })   // 404 = no houses there
        .then(function(list){
          houseCell[k] = [];
          (list || []).forEach(function(h){
            var o = { id:h[0], lat:h[1], lng:h[2], addr:h[3] || '' };
            houses[o.id] = o; houseCell[k].push(o);
          });
          cellState[k] = 'done';
        })
        .catch(function(){ delete cellState[k]; });
    })).then(function(){ return true; });
  }
  // A house is done once a pin points at it, or (pins made before the dots)
  // sits within 12 m of it.
  var doneHouse = {};
  function computeDone(){
    doneHouse = {};
    live('pin').forEach(function(p){
      if (p.data.house) { doneHouse[p.data.house] = p.data.status || 1; return; }
      var near = nearHouse(L.latLng(p.data.lat, p.data.lng), 12);
      if (near) doneHouse[near.id] = p.data.status || 1;
    });
  }
  function nearHouse(ll, meters, skipDone){
    var best = null, bestD = meters, k0 = cellKey(ll.lat, ll.lng).split(':').map(Number);
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      (houseCell[(k0[0] + dy) + ':' + (k0[1] + dx)] || []).forEach(function(h){
        if (skipDone && doneHouse[h.id]) return;
        var d = map.distance(ll, [h.lat, h.lng]);
        if (d < bestD) { bestD = d; best = h; }
      });
    }
    return best;
  }
  var HOUSE_ZOOM = 17;
  function renderHouses(){
    houseLayer.clearLayers();
    computeDone();
    if (map.getZoom() < HOUSE_ZOOM) return;
    var b = map.getBounds().pad(0.2);
    cellsFor(b).forEach(function(k){
      (houseCell[k] || []).forEach(function(h){
        if (doneHouse[h.id] || !b.contains([h.lat, h.lng])) return;
        L.circleMarker([h.lat, h.lng], { renderer:houseRenderer, radius:5.5, weight:1.5, color:'#374151',
          fillColor:'#d1d5db', fillOpacity:0.95, interactive:false }).addTo(houseLayer);
      });
    });
  }
  function refreshHouses(){
    if (map.getZoom() < HOUSE_ZOOM - 1) { houseLayer.clearLayers(); return; }
    renderHouses();
    loadCells(map.getBounds().pad(0.2)).then(function(added){ if (added) renderHouses(); });
  }
  map.on('moveend', refreshHouses);
  var turfLayer = L.layerGroup().addTo(map);
  var markers = {};   // pin id -> circleMarker

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(ms){
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    if (d.toDateString() === now.toDateString()) return 'today ' + t;
    return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' }) + ' ' + t;
  }

  // ---- layout: keep the floating buttons clear of the bars ---------------------
  function layout(){
    var topH = document.querySelector('.top').offsetHeight;
    var bar = $('bar').style.display !== 'none' ? $('bar') : $('drawBar').style.display !== 'none' ? $('drawBar') : null;
    var base = bar ? bar.offsetHeight + 'px' : 'env(safe-area-inset-bottom) + 14px';
    $('locate').style.bottom = 'calc(' + base + ' + 12px)';
    $('layer').style.bottom = 'calc(' + base + ' + 64px)';
    $('searchBtn').style.bottom = 'calc(' + base + ' + 116px)';
    // with a popup open, the strip of map above it is where the house shows;
    // the search bar and the results bar only cover it
    var gotoOn = !drawing && !sheetOpen;
    $('fbar').style.display = mapFilter && !sheetOpen ? 'flex' : 'none';
    $('goto').style.display = gotoOn ? 'flex' : 'none';
    $('goto').style.top = (topH + 8) + 'px';
    var below = topH + (gotoOn ? 60 : 8);
    $('fbar').style.top = below + 'px';
    $('hint').style.top = (below + (mapFilter ? 52 : 2)) + 'px';
  }
  window.addEventListener('resize', layout);

  // ---- render -------------------------------------------------------------------
  function live(kind){
    var out = [];
    for (var id in items) { var it = items[id]; if (it.kind === kind && !it.deleted) out.push(it); }
    return out;
  }

  function renderPins(){
    var seen = {};
    live('pin').forEach(function(it){
      seen[it.id] = 1;
      var d = it.data, c = (STAT[d.status] || STAT.noans).color;
      var mk = markers[it.id];
      if (!mk) {
        mk = L.circleMarker([d.lat, d.lng], { pane:'pins', radius:9, weight:2.5, color:'#fff', fillOpacity:1, fillColor:c, bubblingMouseEvents:false });
        mk.on('click', function(){ if (!drawing) openPin(it.id); });
        mk.addTo(pinLayer);
        markers[it.id] = mk;
      } else {
        mk.setLatLng([d.lat, d.lng]);
        mk.setStyle({ fillColor:c });
      }
      // a search shown on the map fades every house that is not in it
      var dim = mapFilter && !mapFilter[it.id];
      mk.setStyle({ fillOpacity:dim ? 0.18 : 1, opacity:dim ? 0.3 : 1 });
    });
    for (var id in markers) if (!seen[id]) { pinLayer.removeLayer(markers[id]); delete markers[id]; }
  }

  function turfColor(t){ return t.data.color || TURF_COLORS[0]; }
  function renderTurfs(){
    turfLayer.clearLayers();
    live('turf').forEach(function(t){
      if (!t.data.pts || t.data.pts.length < 3) return;
      var poly = L.polygon(t.data.pts, { color:turfColor(t), weight:3, fillOpacity:0.08, interactive:false });
      poly.addTo(turfLayer);
      var lbl = esc(t.data.name || 'Turf') + (t.data.who ? ' · ' + esc(t.data.who) : '');
      // label on the top edge, not the middle, where it would hide a house
      var b = poly.getBounds();
      L.tooltip({ permanent:true, direction:'top', offset:[0,-2], className:'turf-lbl', interactive:false })
        .setLatLng([b.getNorth(), b.getCenter().lng]).setContent(lbl).addTo(turfLayer);
    });
    if (drawing) drawPreview();
  }

  function renderCounts(){
    var pins = live('pin'), by = {}, mineToday = 0, today = new Date().toDateString();
    pins.forEach(function(p){
      by[p.data.status] = (by[p.data.status] || 0) + 1;
      (p.data.log || []).forEach(function(l){ if (l.who === myName && new Date(l.at).toDateString() === today) mineToday++; });
    });
    var h = '<span class="chip">' + doorsN(pins.length) + '</span>';
    STATUSES.forEach(function(s){
      h += '<span class="chip"><span class="dot" style="background:' + s.color + '"></span>' + (by[s.k] || 0) + ' ' + s.label + '</span>';
    });
    if (myName) h += '<span class="chip">You today: ' + mineToday + '</span>';
    $('counts').innerHTML = h;
    var meta = items.meta && !items.meta.deleted ? items.meta.data : {};
    $('title').textContent = meta.title || 'Door Knocking';
    document.title = meta.title || 'Door Knocking';
    $('me').textContent = 'You: ' + (myName || '?') + (teamOf(myTeam) && !same(teamName(myTeam), myName) ? ' · ' + teamName(myTeam) : '') +
      (isPastor() ? ' · Pastor' : isLeader() ? ' · Leader' : '');
    $('reportBtn').style.display = (isPastor() || isLeader()) ? '' : 'none';
    // hidden mid-turf too, or a corner tap near the right edge opens search
    $('searchBtn').style.display = (isPastor() || isLeader()) && !drawing ? 'flex' : 'none';
    // a leader's Share sends the team link, so say so: that is how workers join
    $('shareBtn').textContent = isLeader() ? 'Invite team' : 'Share link';
    // Workers just record the door and what happened. Turfs, inviting and
    // reports are the leaders' and the pastor's (his rule, 10-10).
    var worker = !isLeader() && !isPastor();
    if (!drawing) $('bar').style.display = worker ? 'none' : 'flex';
  }

  function renderSync(){
    var n = Object.keys(pending).length;
    $('sync').textContent = n ? (n + ' not sent yet') : '';
  }

  function render(){ renderPins(); renderHouses(); renderTurfs(); renderCounts(); renderSync(); layout(); }

  // ---- saving: one item at a time, so two phones never erase each other ---------
  function save(it){
    it.updatedAt = Math.max(Date.now(), (items[it.id] && items[it.id].updatedAt || 0) + 1);
    items[it.id] = it;
    pending[it.id] = true;
    persist(); render(); flush();
  }

  var flushing = false;
  function flush(){
    if (flushing) return;
    var ids = Object.keys(pending);
    if (!ids.length) return;
    flushing = true;
    var id = ids[0], it = items[id];
    if (!it) { delete pending[id]; flushing = false; persist(); return flush(); }
    fetch(API + MAP + '/' + id, {
      method:'PUT', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ kind:it.kind, data:it.data, updatedAt:it.updatedAt, deleted:!!it.deleted })
    }).then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        // Only clear it if nothing newer was saved here while this was in flight.
        if (items[id] && items[id].updatedAt === it.updatedAt) delete pending[id];
        if (j && j.stale && j.item && !pending[id]) items[id] = j.item;
        flushing = false; persist(); renderSync();
        if (j && j.stale) render();
        flush();
      })
      .catch(function(){ flushing = false; renderSync(); setTimeout(flush, 6000); });
  }

  var fullPulled = false;
  function pull(){
    // The first pull of every open asks for the WHOLE map, so a phone whose saved
    // copy fell out of step (Lizzy's showed 1 door of 2) heals by just opening.
    fetch(API + MAP + '?since=' + (fullPulled ? Math.max(0, since - 15000) : 0))
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        var changed = false;
        (j.items || []).forEach(function(x){
          var cur = items[x.id];
          if (cur && pending[x.id] && cur.updatedAt >= x.updatedAt) return;
          if (cur && cur.updatedAt > x.updatedAt) return;
          if (cur && cur.updatedAt === x.updatedAt && !!cur.deleted === !!x.deleted) return;
          items[x.id] = x; changed = true;
          if (pending[x.id] && x.updatedAt >= cur.updatedAt) delete pending[x.id];
        });
        since = j.now || since;
        if (!fullPulled) setTimeout(function(){
          checkIn();
          track('open', { v:MY_VER, ua:navigator.userAgent.slice(0, 160), w:screen.width, h:screen.height,
            standalone:!!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) });
        }, 0);   // the team and role are only known once the map has loaded
        fullPulled = true;
        localStorage.setItem(K_SINCE, JSON.stringify(since));
        if (changed) { persist(); adoptMerge(); if (!sheetOpen) render(); else { renderPins(); renderTurfs(); renderCounts(); } }
        if (locFailed) fitPins();
      })
      .catch(function(){});
  }

  // ---- the sheet ------------------------------------------------------------------
  var sheetOpen = false;
  function openSheet(html, noScrim){
    $('sheet').innerHTML = html;
    $('sheet').classList.add('on');
    if (!noScrim) $('scrim').classList.add('on');
    sheetOpen = true;
    layout();
  }
  function closeSheet(){
    $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
    clearRing(); draft = null;
    sheetOpen = false; render();
  }

  // While a house's sheet is open, a blue ring marks the exact spot and the map
  // slides it into the strip above the sheet, so you can see where the dot
  // lands. On a new house, tapping the map again moves it.
  var ring = null, draft = null;
  function showRing(ll, isNew){
    clearRing();
    ring = L.circleMarker(ll, { pane:'pins', radius:isNew ? 11 : 16, weight:4, color:'#1f4fd1',
      fillColor:'#fff', fillOpacity:isNew ? 1 : 0, interactive:false }).addTo(map);
  }
  function clearRing(){ if (ring) { map.removeLayer(ring); ring = null; } }
  function panAboveSheet(ll){
    var top = document.querySelector('.top').offsetHeight;
    var bottom = window.innerHeight - $('sheet').offsetHeight;
    var p = map.latLngToContainerPoint(ll);
    map.panBy([p.x - map.getSize().x / 2, p.y - (top + bottom) / 2]);
  }
  function setSub(t){ var s = document.querySelector('.sheet .sub'); if (s) { s.textContent = t; s.style.color = ''; } }
  $('scrim').addEventListener('click', closeSheet);

  // ---- a house --------------------------------------------------------------------
  var geoSeq = 0;
  function reverse(lat, lng, cb){
    var mine = ++geoSeq;
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + lat + '&lon=' + lng)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (mine !== geoSeq) return;
        var a = j.address || {};
        var road = a.road || a.pedestrian || a.residential || '';
        var s = [a.house_number, road].filter(Boolean).join(' ');
        if (!a.house_number && road) s = road + ' (number?)';
        cb(s || '');
      })
      .catch(function(){ if (mine === geoSeq) cb(''); });
  }

  function ymd(dt){ return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function dayName(s){ if (!s) return ''; var p = s.split('-'); var dt = new Date(+p[0], +p[1] - 1, +p[2], 12);
    return dt.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' }); }
  // leaders see whether a door was marked at the door or somewhere else
  function stoodLine(l){
    var st = l.stood; if (!st) return '';
    if (st.none) return '<div class="ln" style="color:var(--dim)">📍 no location from the phone</div>';
    var far = st.m > 80, txt = st.m < 1000 ? st.m + ' m' : (st.m / 1000).toFixed(1) + ' km';
    return '<div class="ln" style="color:' + (far ? '#c2410c' : '#15803d') + '">📍 marked ' + txt + ' from the house' + (st.acc > 50 ? ' (phone unsure, ±' + st.acc + ' m)' : '') + '</div>';
  }
  function currentCampaign(){ var c = items.campaign; return c && !c.deleted && c.data.name ? c.data.name : ''; }
  function creator(d){ return d.by || (d.log && d.log[0] && d.log[0].who) || ''; }
  function same(a, b){ return !!a && String(a).trim().toLowerCase() === String(b || '').trim().toLowerCase(); }

  // house: a grey dot that was tapped, so the address is already known
  function newPin(latlng, house){
    if (!myName) return askName(function(){ newPin(latlng, house); });
    var at = house ? L.latLng(house.lat, house.lng) : latlng;
    var it = { id:'p' + rid(11), kind:'pin', data:{ lat:+at.lat.toFixed(6), lng:+at.lng.toFixed(6), addr:'', status:'', note:'', log:[] } };
    if (house) it.data.house = house.id;
    pinSheet(it, true);
    useHouse(it, house);
  }
  function useHouse(it, house){
    if (house && house.addr) {
      var el = $('addr');
      if (el && !el.dataset.typed) el.value = house.addr;
      setSub('Wrong house? Tap the right one on the map.');
    } else lookup(it);
  }

  // fill the address for wherever the new dot sits now, unless they typed one
  function lookup(it){
    var el = $('addr');
    if (el && el.dataset.typed) return;
    if (el) el.value = '';
    setSub('Finding the address…');
    reverse(it.data.lat, it.data.lng, function(addr){
      var el = $('addr');
      if (!el || el.dataset.typed || draft !== it) return;
      el.value = addr;
      setSub('Wrong spot? Tap the right house on the map.');
    });
  }

  function moveDraft(ll){
    var house = map.getZoom() >= HOUSE_ZOOM ? nearHouse(ll, snapMeters(), true) : null;
    var at = house ? L.latLng(house.lat, house.lng) : ll;
    draft.data.lat = +at.lat.toFixed(6); draft.data.lng = +at.lng.toFixed(6);
    if (house) draft.data.house = house.id; else delete draft.data.house;
    if (ring) ring.setLatLng(at);
    useHouse(draft, house);
  }
  // A tap snaps to the nearest grey dot within about a fingertip, never further
  // than 25 m (houses on these streets are ~18 m apart, so it still picks the
  // roof that was tapped, not the neighbour's).
  function snapMeters(){ return Math.min(25, tapMeters(32)); }
  // how many metres a finger-width (px) covers at this zoom
  function tapMeters(px){
    var c = map.getSize().divideBy(2);
    return map.distance(map.containerPointToLatLng(c), map.containerPointToLatLng(c.add([px, 0])));
  }

  function openPin(id){
    if (!items[id]) return;
    pinSheet(JSON.parse(JSON.stringify(items[id])), false);
  }

  function pinSheet(it, isNew){
    var d = it.data, chosen = isNew ? '' : d.status;
    var h = '<h3>' + (isNew ? 'Mark this house' : esc(d.addr || 'This house')) + '</h3>';
    h += '<div class="sub">' + (isNew ? 'Finding the address…' :
          (d.who ? 'Last marked by ' + esc(d.who) + ', ' + when(d.at) : '')) + '</div>';
    h += '<label>Address</label><input type="text" id="addr" placeholder="123 Main St" value="' + esc(d.addr) + '">';
    h += '<label>What happened</label><div class="stat">';
    STATUSES.forEach(function(s){
      h += '<button data-k="' + s.k + '" style="border-color:' + s.color + '"><span class="dot" style="background:' + s.color + '"></span>' + s.label + '</button>';
    });
    h += '</div>';
    // Interested / Come back: who to call, and when to come back
    var c = d.contact || {};
    h += '<div id="contactBox" style="display:none"><label>Name and phone (optional)</label>' +
      '<div style="display:flex; gap:8px"><input type="text" id="cname" placeholder="Name" value="' + esc(c.name) + '" autocomplete="off" style="flex:1">' +
      '<input type="text" id="cphone" inputmode="tel" placeholder="Phone" value="' + esc(c.phone) + '" autocomplete="off" style="flex:1"></div></div>';
    h += '<div id="backBox" style="display:none"><label>Come back on</label>' +
      '<div style="display:flex; gap:8px; align-items:center"><input type="date" id="backOn" value="' + esc(d.backOn || '') + '" style="flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font:inherit; font-size:16px; background:#fafafc">' +
      '<button type="button" class="qd" data-d="1">Tomorrow</button><button type="button" class="qd" data-d="sat">Sat</button><button type="button" class="qd" data-d="7">+1 wk</button></div></div>';
    h += '<label>Note</label><textarea id="note" placeholder="Prayer request, best time to come back…">' + esc(d.note) + '</textarea>';
    if (!isNew && c.phone) {
      var tel = String(c.phone).replace(/[^0-9+]/g, '');
      h += '<div class="acts" style="margin-top:10px"><a href="tel:' + esc(tel) + '" style="flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:12px; padding:12px; font-weight:700; color:var(--ink)">📞 Call ' + esc(c.name || '') + '</a>' +
        '<a href="sms:' + esc(tel) + '" style="flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:12px; padding:12px; font-weight:700; color:var(--ink)">💬 Text</a></div>';
    }
    // the leader's follow-up after Interested (saves by itself, it is not a knock)
    var lead = isPastor() || isLeader();
    if (!isNew && lead && (d.status === 'yes' || d.follow)) {
      h += '<label>Follow-up (leaders only)</label><select id="follow">' + FOLLOW.map(function(f){
        return '<option value="' + f.k + '"' + ((d.follow ? d.follow.step : '') === f.k ? ' selected' : '') + '>' + f.label + '</option>';
      }).join('') + '</select>' + (d.follow && d.follow.step ? '<div class="empty" style="font-size:12.5px">Set by ' + esc(d.follow.who) + ', ' + when(d.follow.at) + '</div>' : '');
    }
    if (!isNew && d.log && d.log.length) {
      h += '<label>History</label><ul class="log">' + d.log.slice().reverse().map(function(l){
        var s = STAT[l.status] || STAT.noans;
        return '<li><div class="lh"><span class="dot" style="background:' + s.color + '"></span>' + s.label + ' · ' + esc(l.who) + ' · ' + when(l.at) + '</div>' +
          (l.addr != null ? '<div class="ln">Address: ' + esc(l.addr || '(blank)') + '</div>' : '') +
          (l.contact ? '<div class="ln">Contact: ' + esc([l.contact.name, l.contact.phone].filter(Boolean).join(', ') || '(cleared)') + '</div>' : '') +
          (l.backOn ? '<div class="ln">Come back on ' + esc(dayName(l.backOn)) + '</div>' : '') +
          (l.note != null ? '<div class="ln">“' + esc(l.note || '(note cleared)') + '”</div>' : '') +
          (lead ? stoodLine(l) : '') + '</li>';
      }).join('') + '</ul>';
    }
    if (!isNew && lead && d.followLog && d.followLog.length) {
      h += '<label>Follow-up history</label><ul class="log">' + d.followLog.slice().reverse().map(function(f){
        return '<li><div class="lh">' + esc((FOL[f.step] || FOL['']).label) + ' · ' + esc(f.who) + ' · ' + when(f.at) + '</div></li>';
      }).join('') + '</ul>';
    }
    // anyone can update a house, only whoever put the dot there can remove it
    var canRemove = !isNew && (same(creator(d), myName) || isLeader() || isPastor());
    h += '<div class="acts">' + (canRemove ? '<button class="del" id="delPin">Remove</button>' : '') +
         '<button id="cancelPin">Cancel</button><button class="save" id="savePin">Save</button></div>';
    openSheet(h, true);
    var ll = L.latLng(d.lat, d.lng);
    showRing(ll, isNew);
    draft = isNew ? it : null;
    panAboveSheet(ll);

    function paint(){
      Array.prototype.forEach.call(document.querySelectorAll('.stat button'), function(b){
        var on = b.dataset.k === chosen, s = STAT[b.dataset.k];
        b.classList.toggle('on', on);
        b.style.background = on ? s.color : '#fff';
      });
      $('contactBox').style.display = chosen === 'yes' || chosen === 'back' ? 'block' : 'none';
      $('backBox').style.display = chosen === 'back' ? 'block' : 'none';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.qd'), function(b){
      b.addEventListener('click', function(){
        var dt = new Date(); dt.setHours(12, 0, 0, 0);
        if (b.dataset.d === 'sat') dt.setDate(dt.getDate() + ((6 - dt.getDay() + 7) % 7 || 7));
        else dt.setDate(dt.getDate() + Number(b.dataset.d));
        $('backOn').value = ymd(dt);
      });
    });
    if ($('follow')) $('follow').addEventListener('change', function(){
      var step = this.value, cur = items[it.id]; if (!cur) return;
      var x = JSON.parse(JSON.stringify(cur)), now = Date.now();
      x.data.follow = { step:step, who:myName, at:now };
      x.data.followLog = (x.data.followLog || []).concat([{ step:step, who:myName, at:now }]).slice(-30);
      save(x);
      track('follow.set', { id:x.id, addr:x.data.addr, step:step });
      setSub('Follow-up saved: ' + (FOL[step] || FOL['']).label + '.');
    });
    paint();
    Array.prototype.forEach.call(document.querySelectorAll('.stat button'), function(b){
      b.addEventListener('click', function(){ chosen = b.dataset.k; paint(); });
    });
    $('addr').addEventListener('input', function(){ this.dataset.typed = '1'; });
    $('cancelPin').addEventListener('click', closeSheet);
    $('savePin').addEventListener('click', function(){
      if (!chosen) { var s = document.querySelector('.sheet .sub'); s.textContent = 'Pick what happened first.'; s.style.color = '#e5534b'; return; }
      var now = Date.now(), addr = $('addr').value.trim(), note = $('note').value.trim();
      if (!d.by) d.by = creator(d) || myName;
      // every save goes in the history, with the note and address when they
      // changed, so nothing anybody writes over is lost
      var entry = { status:chosen, who:myName, at:now }, prev = d.status || '';
      if (teamOf(myTeam)) entry.team = myTeam;   // which leader's report this counts in
      var camp = currentCampaign(); if (camp) entry.camp = camp;
      // where the phone was when this was saved, and how far from the house
      if (myPos && now - myPos.t < 3 * 60e3) entry.stood = { lat:+myPos.lat.toFixed(6), lng:+myPos.lng.toFixed(6), acc:myPos.acc,
        m:Math.round(map.distance([myPos.lat, myPos.lng], [d.lat, d.lng])), age:Math.round((now - myPos.t) / 1000) };
      else entry.stood = { none:true };
      if (chosen === 'yes' || chosen === 'back') {
        var cn = $('cname').value.trim().slice(0, 60), cp = $('cphone').value.trim().slice(0, 30), oc = d.contact || {};
        if (cn !== (oc.name || '') || cp !== (oc.phone || '')) { entry.contact = { name:cn, phone:cp }; d.contact = cn || cp ? { name:cn, phone:cp } : null; }
      }
      if (chosen === 'back') {
        var bo = $('backOn').value || '';
        if (bo !== (d.backOn || '')) entry.backOn = bo;
        d.backOn = bo;
      } else if (d.backOn) { d.backOn = ''; }
      if (note !== (d.note || '')) entry.note = note.slice(0, 300);
      if (!isNew && addr !== (d.addr || '')) entry.addr = addr.slice(0, 120);
      d.addr = addr; d.note = note;
      d.log = (d.log || []).concat([entry]).slice(-40);
      d.status = chosen; d.who = myName; d.at = now;
      save(it);
      track('pin.save', { id:it.id, house:d.house || '', addr:d.addr, status:chosen, prev:prev, isNew:isNew,
        m:entry.stood.m, acc:entry.stood.acc, noLoc:!!entry.stood.none, camp:camp || '' });
      closeSheet();
    });
    if (canRemove) $('delPin').addEventListener('click', function(){
      if (!confirm('Remove this house from the map? A leader can put it back.')) return;
      d.removedBy = myName; d.removedAt = Date.now();
      it.deleted = true; save(it);
      track('pin.remove', { id:it.id, addr:d.addr, status:d.status });
      closeSheet();
    });
  }

  // tapping near a pin opens it instead of dropping a second one on the same house
  function nearestPin(latlng){
    var p = map.latLngToContainerPoint(latlng), best = null, bestD = 22;
    for (var id in markers) {
      var q = map.latLngToContainerPoint(markers[id].getLatLng());
      var dd = Math.hypot(p.x - q.x, p.y - q.y);
      if (dd < bestD) { bestD = dd; best = id; }
    }
    return best;
  }

  map.on('click', function(e){
    if (drawing) { addCorner(e.latlng); return; }
    var near = nearestPin(e.latlng);
    if (draft) return near ? openPin(near) : moveDraft(e.latlng);
    if (sheetOpen) return closeSheet();
    if (near) return openPin(near);
    // zoomed out, one tap covers a whole block: zoom in rather than guess a house
    if (map.getZoom() < 17) {
      map.setView(e.latlng, 18);
      hint('Zoomed in. Now tap the house.');
      setTimeout(function(){ if (!drawing) hint(''); }, 2500);
      return;
    }
    newPin(e.latlng, nearHouse(e.latlng, snapMeters(), true));
  });

  // ---- turf -------------------------------------------------------------------------
  // Drawing a turf. Each corner is a handle you can DRAG. A new tap joins the
  // outline where it adds the least length, not after the last tap, so tapping
  // the corners in any order still gives a clean shape (tapping in the "wrong"
  // order used to cross the lines into a bow-tie).
  var drawing = false, drawPts = [], drawLayer = L.layerGroup().addTo(map), editingTurf = null, drawPoly = null, addOrder = [];
  function hint(t){ var h = $('hint'); h.textContent = t; h.style.display = t ? 'block' : 'none'; layout(); }
  var vtxIcon = L.divIcon({ className:'vtx', iconSize:[24, 24] });
  function drawPreview(){
    drawLayer.clearLayers();
    drawPoly = drawPts.length >= 2 ? L.polygon(drawPts, { color:'#1f4fd1', weight:3, dashArray:'6 6', fillOpacity:0.1, interactive:false }).addTo(drawLayer) : null;
    drawPts.forEach(function(p, i){
      var m = L.marker(p, { icon:vtxIcon, draggable:true, keyboard:false, bubblingMouseEvents:false }).addTo(drawLayer);
      m.on('drag', function(e){ var ll = e.target.getLatLng(); drawPts[i] = [ll.lat, ll.lng]; if (drawPoly) drawPoly.setLatLngs(drawPts); });
      m.on('dragend', drawPreview);
    });
    $('finishDraw').disabled = drawPts.length < 3;
    $('finishDraw').style.opacity = drawPts.length < 3 ? .5 : 1;
  }
  function addCorner(ll){
    var p = [ll.lat, ll.lng];
    if (drawPts.length < 3) { drawPts.push(p); addOrder.push(drawPts.length - 1); return drawPreview(); }
    var best = 0, bestCost = Infinity;
    for (var i = 0; i < drawPts.length; i++) {
      var a = drawPts[i], b = drawPts[(i + 1) % drawPts.length];
      var cost = map.distance(a, p) + map.distance(p, b) - map.distance(a, b);
      if (cost < bestCost) { bestCost = cost; best = i + 1; }
    }
    drawPts.splice(best, 0, p);
    addOrder = addOrder.map(function(k){ return k >= best ? k + 1 : k; }); addOrder.push(best);
    drawPreview();
  }
  function startDraw(turf){
    if (!myName) return askName(function(){ startDraw(turf); });
    drawing = true;
    editingTurf = turf && turf.id ? turf : null;
    drawPts = editingTurf ? editingTurf.data.pts.map(function(p){ return p.slice(); }) : [];
    addOrder = [];
    $('bar').style.display = 'none'; $('drawBar').style.display = 'flex'; layout();
    hint(editingTurf ? 'Drag the corners to change the turf. Tap the map to add a corner.' :
      'Tap the corners around the houses, in any order. Drag a corner to move it.');
    $('searchBtn').style.display = 'none';
    if (editingTurf) map.fitBounds(L.polygon(drawPts).getBounds(), { padding:[40,40] });
    drawPreview();
  }
  function endDraw(){
    drawing = false; drawPts = []; addOrder = []; editingTurf = null; drawLayer.clearLayers(); drawPoly = null;
    $('bar').style.display = 'flex'; $('drawBar').style.display = 'none';
    hint('');
  }
  $('drawBtn').addEventListener('click', function(){ startDraw(); });
  $('cancelDraw').addEventListener('click', endDraw);
  $('undoPt').addEventListener('click', function(){
    if (!addOrder.length) return;
    var k = addOrder.pop();
    drawPts.splice(k, 1);
    addOrder = addOrder.map(function(x){ return x > k ? x - 1 : x; });
    drawPreview();
  });
  $('finishDraw').addEventListener('click', function(){
    if (drawPts.length < 3) return;
    if (editingTurf) {
      var t0 = JSON.parse(JSON.stringify(editingTurf)); t0.data.pts = drawPts.slice();
      turfHist(t0, 'corners');
      endDraw(); save(t0); hint('Turf updated.'); setTimeout(function(){ if (!drawing) hint(''); }, 2000);
      return;
    }
    var n = live('turf').length;
    var t = { id:'t' + rid(11), kind:'turf', data:{ pts:drawPts.slice(), name:'', who:'', color:TURF_COLORS[n % TURF_COLORS.length] } };
    endDraw();
    turfSheet(t, true);
  });


  // Everyone on a team: phones that opened its link, plus anyone who has
  // marked a door for it.
  // ---- merged names --------------------------------------------------------------
  // "Amy H" and "Amy Hebert" on one team are one person once a leader merges
  // them: an item per merge (kind meta, data {merge:true, team, from, to}),
  // applied wherever a name is counted. Undo = delete the item.
  function merges(){ return live('meta').filter(function(m){ return m.data && m.data.merge; }); }
  function canon(name, team){
    var n = String(name || '').trim(), seen = 0, ms = merges();
    while (seen++ < 6) {
      var hit = ms.filter(function(m){ return (m.data.team || '') === (team || '') && same(m.data.from, n); })[0];
      if (!hit) break;
      n = hit.data.to;
    }
    return n;
  }
  function teamPeople(teamId){
    var s = {};
    live('member').forEach(function(m){ if (m.data.team === teamId && m.data.name) { var n = canon(m.data.name, teamId); s[n.toLowerCase()] = n; } });
    live('pin').forEach(function(p){ (p.data.log || []).forEach(function(l){ if (l.team === teamId && l.who) { var n = canon(l.who, teamId); s[n.toLowerCase()] = s[n.toLowerCase()] || n; } }); });
    return Object.keys(s).map(function(k){ return s[k]; }).sort(function(a, b){ return a.localeCompare(b); });
  }
  // every change to a turf is kept on it: who, what, when
  function turfHist(t, what){
    t.data.hist = (t.data.hist || []).concat([{ what:what, who:myName, at:Date.now() }]).slice(-50);
    track('turf.' + what, { id:t.id, name:t.data.name || '', team:t.data.team || '', who:t.data.who || '' });
  }
  function canEditTurf(t){ return isPastor() || (isLeader() && (t.data.team || '') === myTeam); }

  function turfSheet(t, isNew){
    // A leader's turf is always their own team; only the pastor picks a team.
    var team = isPastor() ? (isNew ? '' : (t.data.team || '')) : myTeam;
    var picked = {};
    (t.data.whoList || String(t.data.who || '').split(/\s*,\s*|\s+and\s+/)).forEach(function(n){ if (n && n.trim()) picked[n.trim().toLowerCase()] = n.trim(); });
    var h = '<h3>' + (isNew ? 'New turf' : 'Edit turf') + '</h3><div class="sub">Name the area and tap who is working it.</div>';
    h += '<label>Area name</label><input type="text" id="tname" placeholder="Oak St to Pine St" value="' + esc(t.data.name) + '">';
    if (isPastor()) {
      h += '<label>Team</label><select id="tteam"><option value="">No team</option>' + liveTeams().map(function(x){
        return '<option value="' + x.id + '"' + (x.id === team ? ' selected' : '') + '>' + esc(x.data.name) + '</option>';
      }).join('') + '</select>';
    } else {
      h += '<label>Team</label><div class="fixed">' + esc(teamName(team)) + '</div>';
    }
    h += '<label>Who has it</label><div class="pick" id="tpick"></div>';
    var TW = { create:'drew it', edit:'changed the name or people', corners:'moved the corners', delete:'deleted it' };
    if (!isNew && t.data.hist && t.data.hist.length) h += '<label>History</label><ul class="log">' + t.data.hist.slice().reverse().map(function(x){
      return '<li><div class="lh">' + esc(x.who) + ' ' + (TW[x.what] || x.what) + ' · ' + when(x.at) + '</div></li>'; }).join('') + '</ul>';
    h += '<div class="acts">' + (isNew ? '' : '<button class="del" id="delTurf">Delete</button><button id="moveTurf">Corners</button>') +
         '<button id="cancelTurf">Cancel</button><button class="save" id="saveTurf">Save</button></div>';
    openSheet(h);
    function drawPick(){
      var people = teamPeople(team);
      // keep anyone already on this turf even if they have left the team
      Object.keys(picked).forEach(function(k){ if (!people.some(function(n){ return n.toLowerCase() === k; })) people.push(picked[k]); });
      $('tpick').innerHTML = people.length ? people.map(function(n, i){
        return '<button data-i="' + i + '" class="' + (picked[n.toLowerCase()] ? 'on' : '') + '">' + esc(n) + '</button>';
      }).join('') : '<div class="empty" style="font-size:13.5px">' + (team ? 'Nobody has joined this team yet. Send them the Invite team link and they show up here.' : 'Pick a team first.') + '</div>';
      Array.prototype.forEach.call(document.querySelectorAll('#tpick button'), function(b){
        b.addEventListener('click', function(){
          var n = people[+b.dataset.i], k = n.toLowerCase();
          if (picked[k]) delete picked[k]; else picked[k] = n;
          b.classList.toggle('on');
        });
      });
    }
    drawPick();
    if ($('tteam')) $('tteam').addEventListener('change', function(){ team = this.value; picked = {}; drawPick(); });
    $('cancelTurf').addEventListener('click', closeSheet);
    $('saveTurf').addEventListener('click', function(){
      var before = JSON.stringify([t.data.name, t.data.who, t.data.team]);
      t.data.name = $('tname').value.trim() || 'Turf';
      t.data.whoList = Object.keys(picked).map(function(k){ return picked[k]; });
      t.data.who = t.data.whoList.join(', ');
      t.data.team = team;
      if (isNew) turfHist(t, 'create');
      else if (before !== JSON.stringify([t.data.name, t.data.who, t.data.team])) turfHist(t, 'edit');
      save(t); closeSheet();
    });
    if (!isNew) {
      $('delTurf').addEventListener('click', function(){
        if (!confirm('Delete the turf "' + (t.data.name || 'Turf') + '"? The houses stay on the map.')) return;
        turfHist(t, 'delete'); t.deleted = true; save(t); closeSheet();
      });
      $('moveTurf').addEventListener('click', function(){ closeSheet(); startDraw(items[t.id]); });
    }
  }

  function inside(pt, poly){
    var x = pt[1], y = pt[0], ins = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][1], yi = poly[i][0], xj = poly[j][1], yj = poly[j][0];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
    }
    return ins;
  }

  // A turf's progress: of the houses inside it, how many have been knocked.
  function turfHouses(t){
    var b = L.polygon(t.data.pts).getBounds(), out = { total:0, done:0, left:[], loaded:true };
    cellsFor(b).forEach(function(k){
      if (cellState[k] !== 'done') out.loaded = false;
      (houseCell[k] || []).forEach(function(h){
        if (!inside([h.lat, h.lng], t.data.pts)) return;
        if (doneHouse[h.id] === 'vac') { out.vacant = (out.vacant || 0) + 1; return; }   // not a house: out of the count
        out.total++;
        if (doneHouse[h.id]) out.done++; else out.left.push(h);
      });
    });
    return out;
  }
  function loadTurfs(){
    computeDone();
    return Promise.all(live('turf').filter(function(t){ return t.data.pts && t.data.pts.length > 2; })
      .map(function(t){ return loadCells(L.polygon(t.data.pts).getBounds()); }))
      .then(function(r){ computeDone(); return r.some(Boolean); });
  }
  function progressText(hp){
    if (!hp.total) return hp.loaded ? '' : 'counting houses…';
    return hp.done + ' of ' + hp.total + ' houses knocked';
  }
  // the houses in a turf nobody has knocked yet
  function leftList(t, back){
    var hp = turfHouses(t);
    var h = '<h3>' + esc(t.data.name || 'Turf') + ', still to knock</h3><div class="sub">' + progressText(hp) + ' · ' + hp.left.length + ' left</div>';
    h += hp.left.length ? hp.left.slice().sort(function(a, b){ return (a.addr || '~').localeCompare(b.addr || '~', undefined, { numeric:true }); }).slice(0, 400).map(function(x){
      return '<div class="rrow tap" data-h="' + esc(x.id) + '"><span class="dot" style="background:#d1d5db; border-color:#374151"></span><div class="n">' +
        esc(x.addr || 'House, no address on file') + '</div><div class="c">›</div></div>';
    }).join('') : '<div class="empty">' + (hp.total ? 'Every house in this turf has been knocked.' : 'No houses on file for this area.') + '</div>';
    h += '<div class="acts"><button id="llBack">Back</button>' + (hp.left.length ? '<button class="save" id="llMap">Show on map</button>' : '') + '</div>';
    openSheet(h);
    $('llBack').addEventListener('click', back);
    Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-h]'), function(r){
      r.addEventListener('click', function(){ var x = houses[r.dataset.h]; closeSheet(); map.setView([x.lat, x.lng], 19); });
    });
    if ($('llMap')) $('llMap').addEventListener('click', function(){
      closeSheet();
      map.fitBounds(L.latLngBounds(hp.left.map(function(x){ return [x.lat, x.lng]; })), { padding:[50,50], maxZoom:19 });
      if (map.getZoom() < HOUSE_ZOOM) map.setZoom(HOUSE_ZOOM);
    });
  }

  function turfsList(){
    var turfs = live('turf'), pins = live('pin');
    var h = '<h3>Turfs</h3><div class="sub">Each area and how many of its doors are marked.</div>';
    if (!turfs.length) h += '<div class="empty">No turfs yet. Tap ✏️ Draw turf, then tap the corners around a block.</div>';
    turfs.forEach(function(t){
      var n = 0, yes = 0, hp = turfHouses(t);
      pins.forEach(function(p){ if (inside([p.data.lat, p.data.lng], t.data.pts)) { n++; if (p.data.status === 'yes') yes++; } });
      h += '<div class="turf"><span class="sw" style="background:' + turfColor(t) + '"></span><div class="t"><b>' + esc(t.data.name || 'Turf') + '</b>' +
           '<span>' + (t.data.who ? esc(t.data.who) + ' · ' : 'Nobody yet · ') + (progressText(hp) || doorsN(n) + ' marked') + (yes ? ', ' + yes + ' interested' : '') + '</span></div>' +
           (hp.left.length ? '<button data-left="' + t.id + '">Left</button>' : '') +
           '<button data-go="' + t.id + '">Go</button>' + (canEditTurf(t) ? '<button data-ed="' + t.id + '">Edit</button>' : '') + '</div>';
    });
    h += '<div class="acts"><button id="closeTurfs">Close</button></div>';
    openSheet(h);
    Array.prototype.forEach.call(document.querySelectorAll('[data-left]'), function(b){
      b.addEventListener('click', function(){ leftList(items[b.dataset.left], turfsList); });
    });
    $('closeTurfs').addEventListener('click', closeSheet);
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
      b.addEventListener('click', function(){ var t = items[b.dataset.go]; closeSheet(); map.fitBounds(L.polygon(t.data.pts).getBounds(), { padding:[30,30] }); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ed]'), function(b){
      b.addEventListener('click', function(){ turfSheet(JSON.parse(JSON.stringify(items[b.dataset.ed])), false); });
    });
  }
  $('turfsBtn').addEventListener('click', function(){
    turfsList();
    loadTurfs().then(function(added){ if (added && $('closeTurfs')) turfsList(); });
  });

  // ---- name, title, share ----------------------------------------------------------
  function askName(then){
    var h = '<h3>What is your name?</h3><div class="sub">Every house you mark shows who knocked it.</div>' +
            '<input type="text" id="nm" placeholder="Your first name" value="' + esc(myName) + '" autocomplete="given-name">' +
            '<div class="acts"><button class="save" id="nmSave">Save</button></div>';

  $('title').addEventListener('click', function(){

  // Opens the phone's own share sheet (Messages, WhatsApp, Mail…); a computer
  // without one copies the link instead.
  function shareUrl(url, title, said, which, text){
    track('share', { which:which || 'map', url:url.replace(/&L=[^&]+/, '&L=…').replace(/&p=[^&]+/, '&p=…') });
    if (navigator.share) { navigator.share(text ? { title:title, text:text, url:url } : { title:title, url:url }).catch(function(){}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ alert(said); }, function(){ prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  }
  // On a team, Share sends the TEAM link, so whoever opens it lands on that team.
  $('shareBtn').addEventListener('click', function(){
    var t = teamOf(myTeam);
    shareUrl(t ? teamLink(t) : BASE, document.title,
      t ? 'Team link copied. Text it to your workers: whoever opens it is on ' + t.data.name + '.' : 'Link copied. Anyone with it sees and marks this same map.', t ? 'invite' : 'map',
      t ? 'Door knocking with ' + t.data.name + '\'s team. Tap to open the map, then put in your name.' : '');
  });

  // ---- teams + weekly report (leaders and the pastor only) -------------------------
  function doorsN(n){ return n + (n === 1 ? ' door' : ' doors'); }
  function peopleN(n){ return n + (n === 1 ? ' person' : ' people'); }
  function liveTeams(){ return live('team').sort(function(a, b){ return a.data.name.localeCompare(b.data.name); }); }
  function weekStart(ms){ var d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); }   // Sunday
  function addDays(ms, n){ var d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); }
  function dayLabel(ms){ return new Date(ms).toLocaleDateString([], { month:'short', day:'numeric' }); }
  var repWeek = weekStart(Date.now()), repTeam = null;   // repTeam: a team id, '' = no team, null = every team

  // One team's week, off the history every save writes. A house counts for a
  // team if somebody on that team marked it that week; its status is the last
  // one that team gave it.
  function teamWeek(teamId, from, to){
    var people = {}, tot = {}, follow = [], doors = 0, active = {};
    live('pin').forEach(function(p){
      var es = (p.data.log || []).filter(function(l){ return l.at >= from && l.at < to && (l.team || '') === teamId; });
      if (!es.length) return;
      doors++;
      es.forEach(function(l){ var n = canon(l.who, l.team); (people[n] = people[n] || {})[p.id] = 1; });
      var last = es[es.length - 1];
      tot[last.status] = (tot[last.status] || 0) + 1;
      active[p.id] = 1;
      if (last.status === 'yes' || last.status === 'back') follow.push({ p:p, l:last });
    });
    var turfs = live('turf').filter(function(t){ return (t.data.team || '') === teamId && t.data.pts && t.data.pts.length > 2; }).map(function(t){
      var all = 0, wk = 0, hp = turfHouses(t);
      live('pin').forEach(function(p){
        if (!inside([p.data.lat, p.data.lng], t.data.pts)) return;
        all++;
        if ((p.data.log || []).some(function(l){ return l.at >= from && l.at < to; })) wk++;
      });
      return { t:t, all:all, wk:wk, hp:hp };
    });
    return { doors:doors, people:people, tot:tot, follow:follow, turfs:turfs };
  }

  function weekNav(){
    var to = addDays(repWeek, 7);
    return '<div class="wk"><button id="wkPrev">◀</button><b>' + dayLabel(repWeek) + ' – ' + dayLabel(addDays(to, -1)) + '</b>' +
      '<button id="wkNext"' + (to > Date.now() ? ' disabled style="opacity:.35"' : '') + '>▶</button></div>';
  }
  function wireWeek(){
    $('wkPrev').addEventListener('click', function(){ repWeek = addDays(repWeek, -7); report(); });
    $('wkNext').addEventListener('click', function(){ if (addDays(repWeek, 7) <= Date.now()) { repWeek = addDays(repWeek, 7); report(); } });
  }
  function statChips(tot){
    return '<div class="counts" style="flex-wrap:wrap">' + STATUSES.map(function(s){
      return '<span class="chip tap" data-st="' + s.k + '"><span class="dot" style="background:' + s.color + '"></span>' + (tot[s.k] || 0) + ' ' + s.label + ' ›</span>';
    }).join('') + '</div>';
  }

  // ---- tapping a number in the report lists the houses behind it ----------------
  // teamId null = every team. A house is listed with the LAST entry that matches
  // (that team, that person), the same rule the totals use, so a list always
  // agrees with the number that was tapped.
  function weekHouses(teamId, from, to, f){
    var out = [];
    live('pin').forEach(function(p){
      var es = (p.data.log || []).filter(function(l){
        return l.at >= from && l.at < to && (teamId == null || (l.team || '') === teamId) && (!f.who || same(canon(l.who, l.team), f.who));
      });
      if (!es.length) return;
      var last = es[es.length - 1];
      if (f.status && last.status !== f.status) return;
      out.push({ p:p, l:last });
    });
    return out.sort(function(a, b){ return b.l.at - a.l.at; });
  }
  var reopenList = null;
  function houseList(title, sub, rows, back, mergeFrom){
    var h = '<h3>' + esc(title) + '</h3><div class="sub">' + esc(sub) + ' · ' + (rows.length === 1 ? '1 house' : rows.length + ' houses') + '</div>';

  // ---- activity for the report: fetched once per week+team, then cached -----------
  var evCache = {};

  // (the first copy used to stick, so a leader's own removals never showed).
  // Sends this phone's queued events first, so the list includes them.
  function weekEvents(teamId, from, to, cb){
    var key = (teamId == null ? '*' : teamId) + '|' + from, c = evCache[key];
    if ((!c || Date.now() - c.t > 15000) && !evCache[key + '!']) {
      evCache[key + '!'] = 1;
      flushEvents();
      setTimeout(function(){
        fetch(API + MAP + '/events?from=' + from + '&to=' + to + '&limit=2000' + (teamId == null ? '' : '&team=' + encodeURIComponent(teamId)))
          .then(function(r){ return r.json(); })
          .then(function(j){
            evCache[key] = { list:j.events || [], t:Date.now() }; delete evCache[key + '!'];
            if (cb) cb();   // safe: the redraw finds a fresh copy and does not fetch again
          })
          .catch(function(){ delete evCache[key + '!']; });
      }, evq.length ? 1200 : 0);

  }

  // the houses whose LAST visit by this team (null = anyone) left them in a state

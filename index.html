<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="x-knock-version" content="v1.6">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Door Knocking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --ink:#1b1b1f; --dim:#6b6b76; --card:#fff; --line:#e3e3e8; --brand:#1f4fd1;
         --noans:#e8a317; --noint:#e5534b; --yes:#24a35f; --back:#3b82f6 }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%}
  #map{position:fixed; inset:0}
  button{font:inherit; cursor:pointer}

  /* top bar: the map's name and the counts */
  .top{position:fixed; top:0; left:0; right:0; z-index:500; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
       background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(8px)}
  .top .row{display:flex; align-items:center; gap:8px}
  .title{font-weight:700; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:0; background:none; text-align:left; padding:2px 0}
  .me{border:1px solid var(--line); background:#f4f4f7; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:600; white-space:nowrap}
  .counts{display:flex; gap:6px; margin-top:6px; overflow-x:auto; scrollbar-width:none}
  .counts::-webkit-scrollbar{display:none}
  .chip{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; white-space:nowrap;
        background:#f4f4f7; border-radius:999px; padding:4px 9px}
  .dot{width:10px; height:10px; border-radius:50%; flex:0 0 10px; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .sync{font-size:11.5px; color:var(--dim); white-space:nowrap}

  /* bottom bar */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:500; display:flex; gap:8px;
       padding:8px 10px calc(env(safe-area-inset-bottom) + 10px); background:rgba(255,255,255,.94);
       border-top:1px solid var(--line); backdrop-filter:blur(8px)}
  .bar button{flex:1; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 4px; font-size:14px; font-weight:600}
  .bar button.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
  .fab{position:fixed; right:10px; z-index:500; width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
       background:#fff; font-size:19px; box-shadow:0 2px 8px rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center}

  .fbar{position:fixed; left:10px; right:10px; z-index:550; display:none; align-items:center; gap:8px; background:#1f4fd1; color:#fff;
        border-radius:12px; padding:9px 12px; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .fbar span{flex:1}
  .fbar button{border:0; background:rgba(255,255,255,.22); color:#fff; border-radius:8px; padding:6px 10px; font-weight:700}
  .fchips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px}
  .fchips button{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:5px}
  .fchips button.on{background:#1b1b1f; color:#fff; border-color:#1b1b1f}
  mark{background:#ffe58a; color:inherit; border-radius:3px; padding:0 1px}
  .hint{position:fixed; left:50%; transform:translateX(-50%); z-index:600; background:rgba(20,20,26,.88); color:#fff;
        font-size:13.5px; padding:8px 13px; border-radius:10px; max-width:92vw; text-align:center; pointer-events:none}

  /* bottom sheet */
  .scrim{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.28); display:none}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:901; background:var(--card); border-radius:18px 18px 0 0;
         padding:14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:86vh; overflow-y:auto; display:none;
         box-shadow:0 -6px 24px rgba(0,0,0,.18); max-width:620px; margin:0 auto}
  .sheet.on, .scrim.on{display:block}
  .sheet h3{margin:0 0 2px; font-size:18px}
  .sheet .sub{color:var(--dim); font-size:13px; margin-bottom:12px}
  .sheet label{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:12px 0 5px}
  .sheet input[type=text], .sheet textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font:inherit; font-size:16px; background:#fafafc}
  .sheet textarea{min-height:66px; resize:vertical}
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .stat button{border:2px solid var(--line); background:#fff; border-radius:12px; padding:13px 6px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px}
  .stat button.on{color:#fff}
  .acts{display:flex; gap:8px; margin-top:16px}
  .acts button{flex:1; border-radius:12px; padding:13px; font-size:15px; font-weight:700; border:1px solid var(--line); background:#fff}
  .acts .save{background:var(--brand); color:#fff; border-color:var(--brand)}
  .acts .del{flex:0 0 auto; color:var(--noint)}
  .log{margin:12px 0 0; padding:0; list-style:none; font-size:13px; color:var(--dim)}
  .log li{padding:5px 0; border-top:1px solid var(--line)}
  .log li:first-child{border-top:0}
  .log .lh{display:flex; gap:7px; align-items:center}
  .log .ln{margin:3px 0 0 17px; color:var(--ink); white-space:pre-wrap}
  .turf{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 8px; display:flex; align-items:center; gap:10px}
  .turf .sw{width:14px; height:14px; border-radius:4px; flex:0 0 14px}
  .turf .t{flex:1; min-width:0}
  .turf .t b{display:block; font-size:15px}
  .turf .t span{font-size:12.5px; color:var(--dim)}
  .turf button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 10px; font-size:13px; font-weight:600}
  .wk{display:flex; align-items:center; gap:8px; margin:4px 0 6px}
  .wk b{flex:1; text-align:center; font-size:15px}
  .wk button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px; font-size:15px; font-weight:700}
  .rrow{display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px}
  .rrow:first-of-type{border-top:0}
  .rrow .n{flex:1; min-width:0}
  .rrow .n span{display:block; font-size:12.5px; color:var(--dim); white-space:pre-wrap}
  .rrow .c{font-weight:700; white-space:nowrap}
  .tap{cursor:pointer}
  .sheet select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font:inherit; font-size:16px; background:#fafafc}
  .empty{color:var(--dim); font-size:14px; padding:6px 0 4px}
  .leaflet-tooltip.turf-lbl{background:rgba(255,255,255,.9); border:0; box-shadow:0 1px 4px rgba(0,0,0,.25); font-weight:700; font-size:12px; padding:3px 7px}
  .leaflet-tooltip.turf-lbl:before{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="row">
    <button class="title" id="title">Door Knocking</button>
    <span class="sync" id="sync"></span>
    <button class="me" id="me">You: ?</button>
  </div>
  <div class="counts" id="counts"></div>
</div>

<button class="fab" id="locate" title="Where am I">◎</button>
<button class="fab" id="layer" title="Satellite or street map">🗺️</button>
<button class="fab" id="searchBtn" title="Search houses" style="display:none">🔍</button>
<div class="fbar" id="fbar"><span id="fbarText"></span><button id="fbarList">List</button><button id="fbarClear">✕ Clear</button></div>

<div class="hint" id="hint" style="display:none"></div>

<div class="bar" id="bar">
  <button id="drawBtn">✏️ Draw turf</button>
  <button id="turfsBtn">Turfs</button>
  <button id="shareBtn">Share link</button>
  <button id="reportBtn" style="display:none">Report</button>
</div>
<div class="bar" id="drawBar" style="display:none">
  <button id="undoPt">Undo</button>
  <button id="cancelDraw">Cancel</button>
  <button id="finishDraw" class="primary">Finish</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var API = 'https://api.jobhubgo.com/api/knock/';

  var STATUSES = [
    { k:'noans', label:'No answer',      color:'#e8a317' },
    { k:'noint', label:'Not interested', color:'#e5534b' },
    { k:'yes',   label:'Interested',     color:'#24a35f' },
    { k:'back',  label:'Come back',      color:'#3b82f6' }
  ];
  var STAT = {}; STATUSES.forEach(function(s){ STAT[s.k] = s; });
  var TURF_COLORS = ['#8b5cf6','#ec4899','#f97316','#14b8a6','#0ea5e9','#84cc16','#a855f7','#ef4444'];

  // ---- which map: the key rides in the link, like the YAM sheet --------------
  function rid(n){ var a='abcdefghijkmnpqrstuvwxyz23456789', s=''; for(var i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
  var m = /[#&]m=([a-z0-9_-]+)/i.exec(location.hash);
  var MAP = m ? m[1].toLowerCase() : (localStorage.getItem('knock-last-map') || rid(10));
  if (!m) history.replaceState(null, '', location.pathname + location.search + '#m=' + MAP);
  localStorage.setItem('knock-last-map', MAP);

  // Who you are on this map rides in the link too, and sticks on the phone:
  //   &t=<team>              a worker on that leader's team (the team link)
  //   &t=<team>&L=<key>      that team's leader, sees the team's report
  //   &p=<key>               the pastor, sees every team and sets up leaders
  // Workers never pick anything; the link their leader sent does it.
  function hashArg(k){ var x = new RegExp('[#&]' + k + '=([a-z0-9_-]+)', 'i').exec(location.hash); return x ? x[1].toLowerCase() : ''; }
  var K_TEAM = 'knock-team-' + MAP, K_LEAD = 'knock-lead-' + MAP, K_PASTOR = 'knock-pastor-' + MAP;
  if (hashArg('t')) { localStorage.setItem(K_TEAM, hashArg('t')); if (!hashArg('L')) localStorage.removeItem(K_LEAD); }
  if (hashArg('L')) localStorage.setItem(K_LEAD, hashArg('L'));
  if (hashArg('p')) localStorage.setItem(K_PASTOR, hashArg('p'));
  var myTeam = localStorage.getItem(K_TEAM) || '';
  var myLead = localStorage.getItem(K_LEAD) || '';
  var myPastor = localStorage.getItem(K_PASTOR) || '';
  // 🔴 Safari opens a link to this page in the tab ALREADY on it and only swaps
  // the #part, without reloading, so a new team link was never read and the
  // worker stayed off the team. Any new link reloads.
  window.addEventListener('hashchange', function(){ location.reload(); });

  var K_ITEMS = 'knock-items-' + MAP, K_PEND = 'knock-pend-' + MAP, K_SINCE = 'knock-since-' + MAP;
  function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  var items = load(K_ITEMS, {});          // id -> { id, kind, data, updatedAt, deleted }
  var pending = load(K_PEND, {});         // id -> true, written here and not yet on the server
  var since = load(K_SINCE, 0);
  var myName = localStorage.getItem('knock-name') || '';
  function persist(){
    try { localStorage.setItem(K_ITEMS, JSON.stringify(items)); localStorage.setItem(K_PEND, JSON.stringify(pending)); } catch(e){}
  }

  function teamOf(id){ var t = id && items[id]; return t && t.kind === 'team' && !t.deleted ? t : null; }
  function teamName(id){ var t = teamOf(id); return t ? t.data.name : 'No team'; }
  function isPastor(){ var a = items.access; return !!(myPastor && a && !a.deleted && a.data.pastorKey === myPastor); }
  function isLeader(){ var t = teamOf(myTeam); return !!(myLead && t && t.data.leaderKey === myLead); }
  var BASE = location.origin + location.pathname + '#m=' + MAP;
  function teamLink(t){ return BASE + '&t=' + t.id; }
  function leaderLink(t){ return BASE + '&t=' + t.id + '&L=' + t.data.leaderKey; }

  // ---- map ----------------------------------------------------------------------
  var map = L.map('map', { zoomControl:false, attributionControl:true, maxZoom:21 });
  var street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:21, maxNativeZoom:19, attribution:'© OpenStreetMap'
  });
  var sat = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:21, maxNativeZoom:19, attribution:'Imagery © Esri'
    }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:21, maxNativeZoom:19
    })
  ]);
  var useSat = localStorage.getItem('knock-layer') !== 'street';
  (useSat ? sat : street).addTo(map);
  function setLayerIcon(){ $('layer').textContent = useSat ? '🗺️' : '🛰️'; }

  // pins on their own pane so a turf's shading never sits over a house
  map.createPane('pins').style.zIndex = 450;
  var pinLayer = L.layerGroup().addTo(map);
  var turfLayer = L.layerGroup().addTo(map);
  var markers = {};   // pin id -> circleMarker

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(ms){
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    if (d.toDateString() === now.toDateString()) return 'today ' + t;
    return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' }) + ' ' + t;
  }

  // ---- layout: keep the floating buttons clear of the bars ---------------------
  function layout(){
    var topH = document.querySelector('.top').offsetHeight;
    var bar = $('bar').style.display !== 'none' ? $('bar') : $('drawBar').style.display !== 'none' ? $('drawBar') : null;
    var base = bar ? bar.offsetHeight + 'px' : 'env(safe-area-inset-bottom) + 14px';
    $('locate').style.bottom = 'calc(' + base + ' + 12px)';
    $('layer').style.bottom = 'calc(' + base + ' + 64px)';
    $('searchBtn').style.bottom = 'calc(' + base + ' + 116px)';
    $('fbar').style.top = (topH + 8) + 'px';
    $('hint').style.top = (topH + (mapFilter ? 60 : 10)) + 'px';
  }
  window.addEventListener('resize', layout);

  // ---- render -------------------------------------------------------------------
  function live(kind){
    var out = [];
    for (var id in items) { var it = items[id]; if (it.kind === kind && !it.deleted) out.push(it); }
    return out;
  }

  function renderPins(){
    var seen = {};
    live('pin').forEach(function(it){
      seen[it.id] = 1;
      var d = it.data, c = (STAT[d.status] || STAT.noans).color;
      var mk = markers[it.id];
      if (!mk) {
        mk = L.circleMarker([d.lat, d.lng], { pane:'pins', radius:9, weight:2.5, color:'#fff', fillOpacity:1, fillColor:c, bubblingMouseEvents:false });
        mk.on('click', function(){ if (!drawing) openPin(it.id); });
        mk.addTo(pinLayer);
        markers[it.id] = mk;
      } else {
        mk.setLatLng([d.lat, d.lng]);
        mk.setStyle({ fillColor:c });
      }
      // a search shown on the map fades every house that is not in it
      var dim = mapFilter && !mapFilter[it.id];
      mk.setStyle({ fillOpacity:dim ? 0.18 : 1, opacity:dim ? 0.3 : 1 });
    });
    for (var id in markers) if (!seen[id]) { pinLayer.removeLayer(markers[id]); delete markers[id]; }
  }

  function turfColor(t){ return t.data.color || TURF_COLORS[0]; }
  function renderTurfs(){
    turfLayer.clearLayers();
    live('turf').forEach(function(t){
      if (!t.data.pts || t.data.pts.length < 3) return;
      var poly = L.polygon(t.data.pts, { color:turfColor(t), weight:3, fillOpacity:0.08, interactive:false });
      poly.addTo(turfLayer);
      var lbl = esc(t.data.name || 'Turf') + (t.data.who ? ' · ' + esc(t.data.who) : '');
      // label on the top edge, not the middle, where it would hide a house
      var b = poly.getBounds();
      L.tooltip({ permanent:true, direction:'top', offset:[0,-2], className:'turf-lbl', interactive:false })
        .setLatLng([b.getNorth(), b.getCenter().lng]).setContent(lbl).addTo(turfLayer);
    });
    if (drawing) drawPreview();
  }

  function renderCounts(){
    var pins = live('pin'), by = {}, mineToday = 0, today = new Date().toDateString();
    pins.forEach(function(p){
      by[p.data.status] = (by[p.data.status] || 0) + 1;
      (p.data.log || []).forEach(function(l){ if (l.who === myName && new Date(l.at).toDateString() === today) mineToday++; });
    });
    var h = '<span class="chip">' + doorsN(pins.length) + '</span>';
    STATUSES.forEach(function(s){
      h += '<span class="chip"><span class="dot" style="background:' + s.color + '"></span>' + (by[s.k] || 0) + ' ' + s.label + '</span>';
    });
    if (myName) h += '<span class="chip">You today: ' + mineToday + '</span>';
    $('counts').innerHTML = h;
    var meta = items.meta && !items.meta.deleted ? items.meta.data : {};
    $('title').textContent = meta.title || 'Door Knocking';
    document.title = meta.title || 'Door Knocking';
    $('me').textContent = 'You: ' + (myName || '?') + (teamOf(myTeam) ? ' · ' + teamName(myTeam) : '') +
      (isPastor() ? ' · Pastor' : isLeader() ? ' · Leader' : '');
    $('reportBtn').style.display = (isPastor() || isLeader()) ? '' : 'none';
    $('searchBtn').style.display = (isPastor() || isLeader()) ? 'flex' : 'none';
    // a leader's Share sends the team link, so say so: that is how workers join
    $('shareBtn').textContent = isLeader() ? 'Invite team' : 'Share link';
    // A worker on a team just marks houses; inviting and turfs are the leader's.
    var worker = !!teamOf(myTeam) && !isLeader() && !isPastor();
    if (!drawing) $('bar').style.display = worker ? 'none' : 'flex';
  }

  function renderSync(){
    var n = Object.keys(pending).length;
    $('sync').textContent = n ? (n + ' not sent yet') : '';
  }

  function render(){ renderPins(); renderTurfs(); renderCounts(); renderSync(); layout(); }

  // ---- saving: one item at a time, so two phones never erase each other ---------
  function save(it){
    it.updatedAt = Math.max(Date.now(), (items[it.id] && items[it.id].updatedAt || 0) + 1);
    items[it.id] = it;
    pending[it.id] = true;
    persist(); render(); flush();
  }

  var flushing = false;
  function flush(){
    if (flushing) return;
    var ids = Object.keys(pending);
    if (!ids.length) return;
    flushing = true;
    var id = ids[0], it = items[id];
    if (!it) { delete pending[id]; flushing = false; persist(); return flush(); }
    fetch(API + MAP + '/' + id, {
      method:'PUT', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ kind:it.kind, data:it.data, updatedAt:it.updatedAt, deleted:!!it.deleted })
    }).then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        // Only clear it if nothing newer was saved here while this was in flight.
        if (items[id] && items[id].updatedAt === it.updatedAt) delete pending[id];
        if (j && j.stale && j.item && !pending[id]) items[id] = j.item;
        flushing = false; persist(); renderSync();
        if (j && j.stale) render();
        flush();
      })
      .catch(function(){ flushing = false; renderSync(); setTimeout(flush, 6000); });
  }

  function pull(){
    fetch(API + MAP + '?since=' + Math.max(0, since - 15000))
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        var changed = false;
        (j.items || []).forEach(function(x){
          var cur = items[x.id];
          if (cur && pending[x.id] && cur.updatedAt >= x.updatedAt) return;
          if (cur && cur.updatedAt > x.updatedAt) return;
          if (cur && cur.updatedAt === x.updatedAt && !!cur.deleted === !!x.deleted) return;
          items[x.id] = x; changed = true;
          if (pending[x.id] && x.updatedAt >= cur.updatedAt) delete pending[x.id];
        });
        since = j.now || since;
        localStorage.setItem(K_SINCE, JSON.stringify(since));
        if (changed) { persist(); if (!sheetOpen) render(); else { renderPins(); renderTurfs(); renderCounts(); } }
        if (locFailed) fitPins();
      })
      .catch(function(){});
  }

  // ---- the sheet ------------------------------------------------------------------
  var sheetOpen = false;
  function openSheet(html, noScrim){
    $('sheet').innerHTML = html;
    $('sheet').classList.add('on');
    if (!noScrim) $('scrim').classList.add('on');
    sheetOpen = true;
  }
  function closeSheet(){
    $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
    clearRing(); draft = null;
    sheetOpen = false; render();
  }

  // While a house's sheet is open, a blue ring marks the exact spot and the map
  // slides it into the strip above the sheet, so you can see where the dot
  // lands. On a new house, tapping the map again moves it.
  var ring = null, draft = null;
  function showRing(ll, isNew){
    clearRing();
    ring = L.circleMarker(ll, { pane:'pins', radius:isNew ? 11 : 16, weight:4, color:'#1f4fd1',
      fillColor:'#fff', fillOpacity:isNew ? 1 : 0, interactive:false }).addTo(map);
  }
  function clearRing(){ if (ring) { map.removeLayer(ring); ring = null; } }
  function panAboveSheet(ll){
    var top = document.querySelector('.top').offsetHeight;
    var bottom = window.innerHeight - $('sheet').offsetHeight;
    var p = map.latLngToContainerPoint(ll);
    map.panBy([p.x - map.getSize().x / 2, p.y - (top + bottom) / 2]);
  }
  function setSub(t){ var s = document.querySelector('.sheet .sub'); if (s) { s.textContent = t; s.style.color = ''; } }
  $('scrim').addEventListener('click', closeSheet);

  // ---- a house --------------------------------------------------------------------
  var geoSeq = 0;
  function reverse(lat, lng, cb){
    var mine = ++geoSeq;
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + lat + '&lon=' + lng)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (mine !== geoSeq) return;
        var a = j.address || {};
        var road = a.road || a.pedestrian || a.residential || '';
        var s = [a.house_number, road].filter(Boolean).join(' ');
        if (!a.house_number && road) s = road + ' (number?)';
        cb(s || '');
      })
      .catch(function(){ if (mine === geoSeq) cb(''); });
  }

  function creator(d){ return d.by || (d.log && d.log[0] && d.log[0].who) || ''; }
  function same(a, b){ return !!a && String(a).trim().toLowerCase() === String(b || '').trim().toLowerCase(); }

  function newPin(latlng){
    if (!myName) return askName(function(){ newPin(latlng); });
    var it = { id:'p' + rid(11), kind:'pin', data:{ lat:+latlng.lat.toFixed(6), lng:+latlng.lng.toFixed(6), addr:'', status:'', note:'', log:[] } };
    pinSheet(it, true);
    lookup(it);
  }

  // fill the address for wherever the new dot sits now, unless they typed one
  function lookup(it){
    var el = $('addr');
    if (el && el.dataset.typed) return;
    if (el) el.value = '';
    setSub('Finding the address…');
    reverse(it.data.lat, it.data.lng, function(addr){
      var el = $('addr');
      if (!el || el.dataset.typed || draft !== it) return;
      el.value = addr;
      setSub('Wrong spot? Tap the right house on the map.');
    });
  }

  function moveDraft(ll){
    draft.data.lat = +ll.lat.toFixed(6); draft.data.lng = +ll.lng.toFixed(6);
    if (ring) ring.setLatLng(ll);
    lookup(draft);
  }

  function openPin(id){
    if (!items[id]) return;
    pinSheet(JSON.parse(JSON.stringify(items[id])), false);
  }

  function pinSheet(it, isNew){
    var d = it.data, chosen = isNew ? '' : d.status;
    var h = '<h3>' + (isNew ? 'Mark this house' : esc(d.addr || 'This house')) + '</h3>';
    h += '<div class="sub">' + (isNew ? 'Finding the address…' :
          (d.who ? 'Last marked by ' + esc(d.who) + ', ' + when(d.at) : '')) + '</div>';
    h += '<label>Address</label><input type="text" id="addr" placeholder="123 Main St" value="' + esc(d.addr) + '">';
    h += '<label>What happened</label><div class="stat">';
    STATUSES.forEach(function(s){
      h += '<button data-k="' + s.k + '" style="border-color:' + s.color + '"><span class="dot" style="background:' + s.color + '"></span>' + s.label + '</button>';
    });
    h += '</div><label>Note</label><textarea id="note" placeholder="Names, prayer request, best time to come back…">' + esc(d.note) + '</textarea>';
    if (!isNew && d.log && d.log.length) {
      h += '<label>History</label><ul class="log">' + d.log.slice().reverse().map(function(l){
        var s = STAT[l.status] || STAT.noans;
        return '<li><div class="lh"><span class="dot" style="background:' + s.color + '"></span>' + s.label + ' · ' + esc(l.who) + ' · ' + when(l.at) + '</div>' +
          (l.addr != null ? '<div class="ln">Address: ' + esc(l.addr || '(blank)') + '</div>' : '') +
          (l.note != null ? '<div class="ln">“' + esc(l.note || '(note cleared)') + '”</div>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    // anyone can update a house, only whoever put the dot there can remove it
    var canRemove = !isNew && same(creator(d), myName);
    h += '<div class="acts">' + (canRemove ? '<button class="del" id="delPin">Remove</button>' : '') +
         '<button id="cancelPin">Cancel</button><button class="save" id="savePin">Save</button></div>';
    openSheet(h, true);
    var ll = L.latLng(d.lat, d.lng);
    showRing(ll, isNew);
    draft = isNew ? it : null;
    panAboveSheet(ll);

    function paint(){
      Array.prototype.forEach.call(document.querySelectorAll('.stat button'), function(b){
        var on = b.dataset.k === chosen, s = STAT[b.dataset.k];
        b.classList.toggle('on', on);
        b.style.background = on ? s.color : '#fff';
      });
    }
    paint();
    Array.prototype.forEach.call(document.querySelectorAll('.stat button'), function(b){
      b.addEventListener('click', function(){ chosen = b.dataset.k; paint(); });
    });
    $('addr').addEventListener('input', function(){ this.dataset.typed = '1'; });
    $('cancelPin').addEventListener('click', closeSheet);
    $('savePin').addEventListener('click', function(){
      if (!chosen) { var s = document.querySelector('.sheet .sub'); s.textContent = 'Pick what happened first.'; s.style.color = '#e5534b'; return; }
      var now = Date.now(), addr = $('addr').value.trim(), note = $('note').value.trim();
      if (!d.by) d.by = creator(d) || myName;
      // every save goes in the history, with the note and address when they
      // changed, so nothing anybody writes over is lost
      var entry = { status:chosen, who:myName, at:now };
      if (teamOf(myTeam)) entry.team = myTeam;   // which leader's report this counts in
      if (note !== (d.note || '')) entry.note = note.slice(0, 300);
      if (!isNew && addr !== (d.addr || '')) entry.addr = addr.slice(0, 120);
      d.addr = addr; d.note = note;
      d.log = (d.log || []).concat([entry]).slice(-40);
      d.status = chosen; d.who = myName; d.at = now;
      save(it);
      closeSheet();
    });
    if (canRemove) $('delPin').addEventListener('click', function(){
      if (!confirm('Remove this house from the map?')) return;
      it.deleted = true; save(it); closeSheet();
    });
  }

  // tapping near a pin opens it instead of dropping a second one on the same house
  function nearestPin(latlng){
    var p = map.latLngToContainerPoint(latlng), best = null, bestD = 22;
    for (var id in markers) {
      var q = map.latLngToContainerPoint(markers[id].getLatLng());
      var dd = Math.hypot(p.x - q.x, p.y - q.y);
      if (dd < bestD) { bestD = dd; best = id; }
    }
    return best;
  }

  map.on('click', function(e){
    if (drawing) { drawPts.push([e.latlng.lat, e.latlng.lng]); drawPreview(); return; }
    var near = nearestPin(e.latlng);
    if (draft) return near ? openPin(near) : moveDraft(e.latlng);
    if (sheetOpen) return closeSheet();
    if (near) return openPin(near);
    // zoomed out, one tap covers a whole block: zoom in rather than guess a house
    if (map.getZoom() < 17) {
      map.setView(e.latlng, 18);
      hint('Zoomed in. Now tap the house.');
      setTimeout(function(){ if (!drawing) hint(''); }, 2500);
      return;
    }
    newPin(e.latlng);
  });

  // ---- turf -------------------------------------------------------------------------
  var drawing = false, drawPts = [], drawLayer = L.layerGroup().addTo(map), editingTurf = null;
  function hint(t){ var h = $('hint'); h.textContent = t; h.style.display = t ? 'block' : 'none'; layout(); }
  function drawPreview(){
    drawLayer.clearLayers();
    if (drawPts.length >= 2) L.polygon(drawPts, { color:'#1f4fd1', weight:3, dashArray:'6 6', fillOpacity:0.1, interactive:false }).addTo(drawLayer);
    drawPts.forEach(function(p){ L.circleMarker(p, { radius:6, color:'#1f4fd1', fillColor:'#fff', fillOpacity:1, weight:3, interactive:false }).addTo(drawLayer); });
    $('finishDraw').disabled = drawPts.length < 3;
    $('finishDraw').style.opacity = drawPts.length < 3 ? .5 : 1;
  }
  function startDraw(){
    if (!myName) return askName(startDraw);
    drawing = true; drawPts = [];
    $('bar').style.display = 'none'; $('drawBar').style.display = 'flex';
    hint('Tap the corners of the turf around the houses. Finish when it is closed in.');
    drawPreview();
  }
  function endDraw(){
    drawing = false; drawPts = []; drawLayer.clearLayers();
    $('bar').style.display = 'flex'; $('drawBar').style.display = 'none';
    hint('');
  }
  $('drawBtn').addEventListener('click', startDraw);
  $('cancelDraw').addEventListener('click', endDraw);
  $('undoPt').addEventListener('click', function(){ drawPts.pop(); drawPreview(); });
  $('finishDraw').addEventListener('click', function(){
    if (drawPts.length < 3) return;
    var n = live('turf').length;
    var t = { id:'t' + rid(11), kind:'turf', data:{ pts:drawPts.slice(), name:'', who:'', color:TURF_COLORS[n % TURF_COLORS.length] } };
    endDraw();
    turfSheet(t, true);
  });

  function knownNames(){
    var s = {};
    if (myName) s[myName] = 1;
    live('pin').forEach(function(p){ (p.data.log || []).forEach(function(l){ if (l.who) s[l.who] = 1; }); });
    live('turf').forEach(function(t){ if (t.data.who) s[t.data.who] = 1; });
    return Object.keys(s).sort();
  }

  function turfSheet(t, isNew){
    var h = '<h3>' + (isNew ? 'New turf' : 'Edit turf') + '</h3><div class="sub">Name the area and who is working it.</div>';
    h += '<label>Area name</label><input type="text" id="tname" placeholder="Oak St to Pine St" value="' + esc(t.data.name) + '">';
    h += '<label>Who has it</label><input type="text" id="twho" list="names" placeholder="Paul and Ryan" value="' + esc(t.data.who) + '">';
    h += '<datalist id="names">' + knownNames().map(function(n){ return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
    var teams = liveTeams();
    if (teams.length) {
      var cur = isNew ? (teamOf(myTeam) ? myTeam : '') : (t.data.team || '');
      h += '<label>Team</label><select id="tteam"><option value="">No team</option>' + teams.map(function(x){
        return '<option value="' + x.id + '"' + (x.id === cur ? ' selected' : '') + '>' + esc(x.data.name) + '</option>';
      }).join('') + '</select>';
    }
    h += '<div class="acts">' + (isNew ? '' : '<button class="del" id="delTurf">Delete</button>') +
         '<button id="cancelTurf">Cancel</button><button class="save" id="saveTurf">Save</button></div>';
    openSheet(h);
    $('cancelTurf').addEventListener('click', closeSheet);
    $('saveTurf').addEventListener('click', function(){
      t.data.name = $('tname').value.trim() || 'Turf';
      t.data.who = $('twho').value.trim();
      if ($('tteam')) t.data.team = $('tteam').value;
      save(t); closeSheet();
    });
    if (!isNew) $('delTurf').addEventListener('click', function(){
      if (!confirm('Delete the turf "' + (t.data.name || 'Turf') + '"? The houses stay on the map.')) return;
      t.deleted = true; save(t); closeSheet();
    });
  }

  function inside(pt, poly){
    var x = pt[1], y = pt[0], ins = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][1], yi = poly[i][0], xj = poly[j][1], yj = poly[j][0];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
    }
    return ins;
  }

  function turfsList(){
    var turfs = live('turf'), pins = live('pin');
    var h = '<h3>Turfs</h3><div class="sub">Each area and how many of its doors are marked.</div>';
    if (!turfs.length) h += '<div class="empty">No turfs yet. Tap ✏️ Draw turf, then tap the corners around a block.</div>';
    turfs.forEach(function(t){
      var n = 0, yes = 0;
      pins.forEach(function(p){ if (inside([p.data.lat, p.data.lng], t.data.pts)) { n++; if (p.data.status === 'yes') yes++; } });
      h += '<div class="turf"><span class="sw" style="background:' + turfColor(t) + '"></span><div class="t"><b>' + esc(t.data.name || 'Turf') + '</b>' +
           '<span>' + (t.data.who ? esc(t.data.who) + ' · ' : 'Nobody yet · ') + doorsN(n) + (yes ? ', ' + yes + ' interested' : '') + '</span></div>' +
           '<button data-go="' + t.id + '">Go</button><button data-ed="' + t.id + '">Edit</button></div>';
    });
    h += '<div class="acts"><button id="closeTurfs">Close</button></div>';
    openSheet(h);
    $('closeTurfs').addEventListener('click', closeSheet);
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
      b.addEventListener('click', function(){ var t = items[b.dataset.go]; closeSheet(); map.fitBounds(L.polygon(t.data.pts).getBounds(), { padding:[30,30] }); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ed]'), function(b){
      b.addEventListener('click', function(){ turfSheet(JSON.parse(JSON.stringify(items[b.dataset.ed])), false); });
    });
  }
  $('turfsBtn').addEventListener('click', turfsList);

  // ---- name, title, share ----------------------------------------------------------
  function askName(then){
    var h = '<h3>What is your name?</h3><div class="sub">Every house you mark shows who knocked it.</div>' +
            '<input type="text" id="nm" placeholder="Your first name" value="' + esc(myName) + '" autocomplete="given-name">' +
            '<div class="acts"><button class="save" id="nmSave">Save</button></div>';
    openSheet(h);
    var el = $('nm'); setTimeout(function(){ el.focus(); }, 50);
    function go(){
      var v = el.value.trim(); if (!v) return el.focus();
      myName = v; localStorage.setItem('knock-name', v);
      closeSheet(); if (then) then();
    }
    $('nmSave').addEventListener('click', go);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  }
  $('me').addEventListener('click', function(){ askName(); });

  $('title').addEventListener('click', function(){
    var cur = items.meta && !items.meta.deleted ? items.meta.data.title : '';
    var v = prompt('Name this map', cur || 'Door Knocking');
    if (v == null) return;
    save({ id:'meta', kind:'meta', data:{ title:v.trim() } });
  });

  function shareUrl(url, title, said){
    if (navigator.share) { navigator.share({ title:title, url:url }).catch(function(){}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ alert(said); }, function(){ prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  }
  // On a team, Share sends the TEAM link, so whoever opens it lands on that team.
  $('shareBtn').addEventListener('click', function(){
    var t = teamOf(myTeam);
    shareUrl(t ? teamLink(t) : BASE, document.title,
      t ? 'Team link copied. Text it to your workers: whoever opens it is on ' + t.data.name + '.' : 'Link copied. Anyone with it sees and marks this same map.');
  });

  // ---- teams + weekly report (leaders and the pastor only) -------------------------
  function doorsN(n){ return n + (n === 1 ? ' door' : ' doors'); }
  function peopleN(n){ return n + (n === 1 ? ' person' : ' people'); }
  function liveTeams(){ return live('team').sort(function(a, b){ return a.data.name.localeCompare(b.data.name); }); }
  function weekStart(ms){ var d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); }   // Sunday
  function addDays(ms, n){ var d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); }
  function dayLabel(ms){ return new Date(ms).toLocaleDateString([], { month:'short', day:'numeric' }); }
  var repWeek = weekStart(Date.now()), repTeam = null;   // repTeam: a team id, '' = no team, null = every team

  // One team's week, off the history every save writes. A house counts for a
  // team if somebody on that team marked it that week; its status is the last
  // one that team gave it.
  function teamWeek(teamId, from, to){
    var people = {}, tot = {}, follow = [], doors = 0, active = {};
    live('pin').forEach(function(p){
      var es = (p.data.log || []).filter(function(l){ return l.at >= from && l.at < to && (l.team || '') === teamId; });
      if (!es.length) return;
      doors++;
      es.forEach(function(l){ (people[l.who] = people[l.who] || {})[p.id] = 1; });
      var last = es[es.length - 1];
      tot[last.status] = (tot[last.status] || 0) + 1;
      active[p.id] = 1;
      if (last.status === 'yes' || last.status === 'back') follow.push({ p:p, l:last });
    });
    var turfs = live('turf').filter(function(t){ return (t.data.team || '') === teamId && t.data.pts && t.data.pts.length > 2; }).map(function(t){
      var all = 0, wk = 0;
      live('pin').forEach(function(p){
        if (!inside([p.data.lat, p.data.lng], t.data.pts)) return;
        all++;
        if ((p.data.log || []).some(function(l){ return l.at >= from && l.at < to; })) wk++;
      });
      return { t:t, all:all, wk:wk };
    });
    return { doors:doors, people:people, tot:tot, follow:follow, turfs:turfs };
  }

  function weekNav(){
    var to = addDays(repWeek, 7);
    return '<div class="wk"><button id="wkPrev">◀</button><b>' + dayLabel(repWeek) + ' – ' + dayLabel(addDays(to, -1)) + '</b>' +
      '<button id="wkNext"' + (to > Date.now() ? ' disabled style="opacity:.35"' : '') + '>▶</button></div>';
  }
  function wireWeek(){
    $('wkPrev').addEventListener('click', function(){ repWeek = addDays(repWeek, -7); report(); });
    $('wkNext').addEventListener('click', function(){ if (addDays(repWeek, 7) <= Date.now()) { repWeek = addDays(repWeek, 7); report(); } });
  }
  function statChips(tot){
    return '<div class="counts" style="flex-wrap:wrap">' + STATUSES.map(function(s){
      return '<span class="chip"><span class="dot" style="background:' + s.color + '"></span>' + (tot[s.k] || 0) + ' ' + s.label + '</span>';
    }).join('') + '</div>';
  }

  function report(){
    var to = addDays(repWeek, 7);
    if (!isPastor()) repTeam = myTeam;              // a leader only ever sees their own team
    if (repTeam == null) return reportAll(to);
    var w = teamWeek(repTeam, repWeek, to);
    var h = '<h3>' + esc(teamName(repTeam)) + '</h3><div class="sub">Weekly report, Sunday to Saturday</div>' + weekNav();
    h += '<div class="rrow"><div class="n">Doors knocked</div><div class="c">' + w.doors + '</div></div>' + statChips(w.tot);
    h += '<label>Doors per person</label>';
    var ppl = Object.keys(w.people).map(function(n){ return [n, Object.keys(w.people[n]).length]; }).sort(function(a, b){ return b[1] - a[1]; });
    h += ppl.length ? ppl.map(function(x){ return '<div class="rrow"><div class="n">' + esc(x[0]) + '</div><div class="c">' + x[1] + '</div></div>'; }).join('')
                    : '<div class="empty">Nobody on this team marked a door this week.</div>';
    h += '<label>Interested and come back</label>';
    h += w.follow.length ? w.follow.sort(function(a, b){ return a.l.at - b.l.at; }).map(function(f){
      var s = STAT[f.l.status];
      return '<div class="rrow tap" data-pin="' + f.p.id + '"><span class="dot" style="background:' + s.color + '"></span><div class="n">' +
        esc(f.p.data.addr || 'No address') + '<span>' + s.label + ' · ' + esc(f.l.who) + ' · ' + when(f.l.at) +
        (f.p.data.note ? '\n“' + esc(f.p.data.note) + '”' : '') + '</span></div></div>';
    }).join('') : '<div class="empty">None this week.</div>';
    h += '<label>Turfs</label>';
    h += w.turfs.length ? w.turfs.map(function(x){
      return '<div class="rrow"><span class="dot" style="background:' + turfColor(x.t) + '"></span><div class="n">' + esc(x.t.data.name || 'Turf') +
        '<span>' + x.wk + ' this week</span></div><div class="c">' + doorsN(x.all) + ' marked</div></div>';
    }).join('') : '<div class="empty">No turf drawn for this team. Pick the team when you draw or edit one.</div>';
    h += '<div class="acts">' + (isPastor() ? '<button id="repBack">All teams</button>' : '') + '<button id="repClose">Close</button></div>';
    openSheet(h);
    wireWeek();
    $('repClose').addEventListener('click', closeSheet);
    if ($('repBack')) $('repBack').addEventListener('click', function(){ repTeam = null; report(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pin]'), function(r){
      r.addEventListener('click', function(){ var p = items[r.dataset.pin]; closeSheet(); map.setView([p.data.lat, p.data.lng], 19); openPin(p.id); });
    });
  }

  function reportAll(to){
    var rows = liveTeams().map(function(t){ return [t.id, t.data.name]; });
    rows.push(['', 'No team']);
    var all = { doors:0, tot:{} };
    var h = '<h3>All teams</h3><div class="sub">Weekly report, Sunday to Saturday. Tap a team for the detail.</div>' + weekNav();
    var body = rows.map(function(r){
      var w = teamWeek(r[0], repWeek, to);
      if (r[0] === '' && !w.doors) return '';
      all.doors += w.doors;
      STATUSES.forEach(function(s){ all.tot[s.k] = (all.tot[s.k] || 0) + (w.tot[s.k] || 0); });
      return '<div class="rrow tap" data-team="' + r[0] + '"><div class="n">' + esc(r[1]) + '<span>' +
        (w.tot.yes || 0) + ' interested · ' + (w.tot.back || 0) + ' come back · ' + peopleN(Object.keys(w.people).length) + '</span></div>' +
        '<div class="c">' + doorsN(w.doors) + ' ›</div></div>';
    }).join('');
    h += '<div class="rrow"><div class="n"><b>Everyone</b></div><div class="c">' + doorsN(all.doors) + '</div></div>' + statChips(all.tot);
    h += '<label>Teams</label>' + (liveTeams().length ? body : '<div class="empty">No leaders set up yet. Tap Leaders to add them.</div>' + body);
    h += '<div class="acts"><button id="repTeams">Leaders</button><button id="repClose">Close</button></div>';
    openSheet(h);
    wireWeek();
    $('repClose').addEventListener('click', closeSheet);
    $('repTeams').addEventListener('click', teamsSetup);
    Array.prototype.forEach.call(document.querySelectorAll('[data-team]'), function(r){
      r.addEventListener('click', function(){ repTeam = r.dataset.team; report(); });
    });
  }

  // Pastor only: add a leader, send them their link.
  function teamsSetup(){
    var h = '<h3>Leaders</h3><div class="sub">Add each leader, then send them their leader link. They send their team the team link from their own Share button.</div>';
    var teams = liveTeams();
    h += teams.length ? teams.map(function(t){
      return '<div class="turf"><div class="t"><b>' + esc(t.data.name) + '</b></div>' +
        '<button data-lead="' + t.id + '">Leader link</button><button data-del="' + t.id + '">✕</button></div>';
    }).join('') : '<div class="empty">No leaders yet.</div>';
    h += '<label>Add a leader</label><input type="text" id="newLead" placeholder="e.g. Bro Paul">';
    h += '<div class="acts"><button id="tsBack">Back</button><button class="save" id="tsAdd">Add</button></div>';
    h += '<label>Your pastor link</label><div class="empty">Only for you and the pastor. It sees every team.</div>' +
         '<div class="acts" style="margin-top:6px"><button id="tsPastor">Send pastor link</button></div>';
    openSheet(h);
    $('tsBack').addEventListener('click', function(){ repTeam = null; report(); });
    $('tsAdd').addEventListener('click', function(){
      var n = $('newLead').value.trim(); if (!n) return $('newLead').focus();
      save({ id:'tm' + rid(10), kind:'team', data:{ name:n, leaderKey:rid(12) } });
      teamsSetup();
    });
    $('tsPastor').addEventListener('click', function(){ shareUrl(BASE + '&p=' + myPastor, 'Door knocking, pastor link', 'Pastor link copied.'); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lead]'), function(b){
      b.addEventListener('click', function(){ var t = items[b.dataset.lead];
        shareUrl(leaderLink(t), 'Door knocking, ' + t.data.name, 'Leader link for ' + t.data.name + ' copied. Send it to them only.'); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){ var t = JSON.parse(JSON.stringify(items[b.dataset.del]));
        if (!confirm('Remove ' + t.data.name + ' as a leader? Doors their team marked stay on the map.')) return;
        t.deleted = true; save(t); teamsSetup(); });
    });
  }
  // ---- search (leaders and the pastor) ---------------------------------------------
  // "We knocked a Sarah, which door was it?" Searches the address, the note, every
  // OLD note in the history (a note somebody wrote over still counts), who
  // knocked it and their team. Every word typed has to be found somewhere.
  var mapFilter = null;                                   // pin id -> 1 while results are shown on the map
  var sq = { q:'', st:{}, week:false, team:false };       // kept so reopening search restores it
  function hay(p){
    var d = p.data, parts = [d.addr, d.note, d.who];
    (d.log || []).forEach(function(l){ parts.push(l.note, l.addr, l.who, l.team ? teamName(l.team) : ''); });
    return parts.filter(Boolean).join(' \n ').toLowerCase();
  }
  function searchPins(){
    var words = sq.q.toLowerCase().split(/\s+/).filter(Boolean);
    var wk = weekStart(Date.now()), anySt = Object.keys(sq.st).some(function(k){ return sq.st[k]; });
    return live('pin').filter(function(p){
      if (anySt && !sq.st[p.data.status]) return false;
      if (sq.week && !(p.data.log || []).some(function(l){ return l.at >= wk; })) return false;
      if (sq.team && !(p.data.log || []).some(function(l){ return l.team === myTeam; })) return false;
      if (!words.length) return true;
      var h = hay(p);
      return words.every(function(w){ return h.indexOf(w) >= 0; });
    }).sort(function(a, b){ return (b.data.at || 0) - (a.data.at || 0); });
  }
  function hl(text, words){
    var t = esc(text);
    words.forEach(function(w){
      var e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (e) t = t.replace(new RegExp('(' + e + ')', 'ig'), '<mark>$1</mark>');
    });
    return t;
  }
  // the line that explains WHY a house came up: the note that holds the word
  function why(p, words){
    if (!words.length) return p.data.note ? { old:false, text:p.data.note } : null;
    var notes = [p.data.note].concat((p.data.log || []).map(function(l){ return l.note; }).reverse()).filter(Boolean);
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i].toLowerCase();
      if (words.some(function(w){ return n.indexOf(w) >= 0; })) return { old:!!i && notes[i] !== p.data.note, text:notes[i] };
    }
    return p.data.note ? { old:false, text:p.data.note } : null;
  }
  function resultsHtml(list){
    var words = sq.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!list.length) return '<div class="empty">No houses match.</div>';
    return list.slice(0, 150).map(function(p){
      var d = p.data, s = STAT[d.status] || STAT.noans, w = why(p, words);
      return '<div class="rrow tap" data-pin="' + p.id + '"><span class="dot" style="background:' + s.color + '"></span><div class="n">' +
        hl(d.addr || 'No address', words) + '<span>' + s.label + ' · ' + hl(d.who || '', words) + ' · ' + when(d.at) +
        (w ? '\n' + (w.old ? 'Earlier note ' : '') + '“' + hl(w.text, words) + '”' : '') + '</span></div></div>';
    }).join('') + (list.length > 150 ? '<div class="empty">Showing the newest 150. Type more to narrow it.</div>' : '');
  }
  function searchSheet(){
    var h = '<h3>Search houses</h3><input type="text" id="sq" placeholder="A name, street, phone, or who knocked" value="' + esc(sq.q) + '" autocomplete="off">';
    h += '<div class="fchips">' + STATUSES.map(function(s){
      return '<button data-st="' + s.k + '" class="' + (sq.st[s.k] ? 'on' : '') + '"><span class="dot" style="background:' + s.color + '"></span>' + s.label + '</button>';
    }).join('') + '<button data-f="week" class="' + (sq.week ? 'on' : '') + '">This week</button>' +
      (teamOf(myTeam) ? '<button data-f="team" class="' + (sq.team ? 'on' : '') + '">' + esc(teamName(myTeam)) + '</button>' : '') + '</div>';
    h += '<div class="sub" id="sCount" style="margin:8px 0 2px"></div><div id="sRes"></div>';
    h += '<div class="acts"><button id="sClose">Close</button><button class="save" id="sMap">Show on map</button></div>';
    openSheet(h);
    function run(){
      var list = searchPins();
      $('sCount').textContent = list.length === 1 ? '1 house' : list.length + ' houses';
      $('sRes').innerHTML = resultsHtml(list);
      Array.prototype.forEach.call(document.querySelectorAll('#sRes [data-pin]'), function(r){
        r.addEventListener('click', function(){ var p = items[r.dataset.pin]; closeSheet(); map.setView([p.data.lat, p.data.lng], 19); openPin(p.id); });
      });
      return list;
    }
    run();
    $('sq').addEventListener('input', function(){ sq.q = this.value; run(); });
    Array.prototype.forEach.call(document.querySelectorAll('.fchips button'), function(b){
      b.addEventListener('click', function(){
        if (b.dataset.st) sq.st[b.dataset.st] = !sq.st[b.dataset.st];
        else sq[b.dataset.f] = !sq[b.dataset.f];
        b.classList.toggle('on'); run();
      });
    });
    $('sClose').addEventListener('click', closeSheet);
    $('sMap').addEventListener('click', function(){
      var list = run();
      if (!list.length) return;
      mapFilter = {}; list.forEach(function(p){ mapFilter[p.id] = 1; });
      closeSheet();
      map.fitBounds(L.latLngBounds(list.map(function(p){ return [p.data.lat, p.data.lng]; })), { padding:[60,60], maxZoom:19 });
      showFbar(list.length);
    });
    if (!sq.q) setTimeout(function(){ var el = $('sq'); if (el) el.focus(); }, 60);
  }
  function showFbar(n){
    $('fbarText').textContent = 'Showing ' + (n === 1 ? '1 house' : n + ' houses') + ' from your search';
    $('fbar').style.display = 'flex'; render();
  }
  $('fbarClear').addEventListener('click', function(){ mapFilter = null; $('fbar').style.display = 'none'; render(); });
  $('fbarList').addEventListener('click', searchSheet);
  $('searchBtn').addEventListener('click', searchSheet);

  $('reportBtn').addEventListener('click', function(){ repTeam = isPastor() ? null : myTeam; report(); });

  // ---- locate + layer ----------------------------------------------------------------
  // The map opens where you are standing, and the blue dot follows you as you
  // walk. Only if the phone will not say where you are does it open on the
  // houses already marked instead.
  var meDot = null, myLL = null, located = false, locFailed = false, fitted = false;
  function showMe(pos){
    myLL = [pos.coords.latitude, pos.coords.longitude];
    if (meDot) meDot.setLatLng(myLL);
    else meDot = L.circleMarker(myLL, { radius:7, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1, interactive:false }).addTo(map);
    if (!located && !fitted) map.setView(myLL, 18);
    located = true;
  }
  function watchMe(){
    if (!navigator.geolocation) { locFailed = true; return fitPins(); }
    navigator.geolocation.watchPosition(showMe, function(){
      if (!located) { locFailed = true; fitPins(); }
    }, { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
  }
  function fitPins(){
    if (located || fitted) return;
    var pts = live('pin').map(function(p){ return [p.data.lat, p.data.lng]; });
    live('turf').forEach(function(t){ pts = pts.concat(t.data.pts); });
    if (pts.length) { fitted = true; map.fitBounds(L.latLngBounds(pts), { padding:[40,40], maxZoom:18 }); }
  }
  $('locate').addEventListener('click', function(){
    if (myLL) return map.setView(myLL, Math.max(map.getZoom(), 18));
    if (!navigator.geolocation) return alert('This phone cannot share its location.');
    navigator.geolocation.getCurrentPosition(function(pos){ showMe(pos); map.setView(myLL, 18); },
      function(){ alert('Could not get your location. Check that location is allowed for this site.'); },
      { enableHighAccuracy:true, timeout:10000, maximumAge:15000 });
  });
  $('layer').addEventListener('click', function(){
    map.removeLayer(useSat ? sat : street);
    useSat = !useSat;
    (useSat ? sat : street).addTo(map);
    localStorage.setItem('knock-layer', useSat ? 'sat' : 'street');
    setLayerIcon();
  });


  // ---- go ------------------------------------------------------------------------------
  map.setView([30.5044, -90.4612], 13);
  setLayerIcon();
  render();
  watchMe();
  pull(); flush();
  setInterval(function(){ if (!document.hidden) { pull(); flush(); } }, 8000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { pull(); flush(); } });
  window.addEventListener('online', flush);
  if (!myName) askName();
})();
</script>
</body>
</html>

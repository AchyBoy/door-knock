      r.addEventListener('click', function(){ var p = items[r.dataset.pin]; closeSheet(); map.setView([p.data.lat, p.data.lng], 19); openPin(p.id); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-turf]'), function(r){
      r.addEventListener('click', function(){ var t = items[r.dataset.turf];
        if (turfHouses(t).total) return leftList(t, report);
        closeSheet(); map.fitBounds(L.polygon(t.data.pts).getBounds(), { padding:[30,30] }); });
    });
    wireTaps(repTeam, teamName(repTeam), to, roster);
  }

  function reportAll(to){
    var rows = liveTeams().map(function(t){ return [t.id, t.data.name]; });
    rows.push(['', 'No team']);
    var all = { doors:0, tot:{} };
    var h = '<h3>All teams</h3><div class="sub">Weekly report, Sunday to Saturday. Tap a team for the detail.' + (currentCampaign() ? ' Now: ' + esc(currentCampaign()) + '.' : '') + '</div>' + weekNav();
    var body = rows.map(function(r){
      var w = teamWeek(r[0], repWeek, to);
      if (r[0] === '' && !w.doors) return '';
      all.doors += w.doors;
      STATUSES.forEach(function(s){ all.tot[s.k] = (all.tot[s.k] || 0) + (w.tot[s.k] || 0); });
      return '<div class="rrow tap" data-team="' + r[0] + '"><div class="n">' + esc(r[1]) + '<span>' +
        (w.tot.yes || 0) + ' interested · ' + (w.tot.back || 0) + ' come back · ' + peopleN(Object.keys(w.people).length) + ' knocked</span></div>' +
        '<div class="c">' + doorsN(w.doors) + ' ›</div></div>';
    }).join('');
    h += '<div class="rrow tap" data-all="1"><div class="n"><b>Everyone</b></div><div class="c">' + doorsN(all.doors) + ' ›</div></div>' + statChips(all.tot);
    h += '<label>Teams</label>' + (liveTeams().length ? body : '<div class="empty">No leaders set up yet. Tap Leaders to add them.</div>' + body);
    h += extraSections(null, repWeek, to) + campaignSection();
    h += '<div class="acts"><button id="repTeams">Leaders</button><button id="repAct">Activity</button><button id="repClose">Close</button></div>';
    openSheet(h);
    wireWeek();
    $('repClose').addEventListener('click', closeSheet);
    $('repTeams').addEventListener('click', teamsSetup);
    $('repAct').addEventListener('click', function(){ track('activity.view', { team:'*' }); activitySheet(null); });
    wireExtras();
    Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-pin]'), function(r){
      r.addEventListener('click', function(){ var p = items[r.dataset.pin]; closeSheet(); map.setView([p.data.lat, p.data.lng], 19); openPin(p.id); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-team]'), function(r){
      r.addEventListener('click', function(){ repTeam = r.dataset.team; report(); });
    });
    wireTaps(null, 'Everyone', to, []);
  }

  // Pastor only: add a leader, send them their link.
  function teamsSetup(){
    var h = '<h3>Leaders</h3><div class="sub">Add each leader, then send them their leader link. They send their team the team link from their own Share button.</div>';
    var teams = liveTeams();
    h += teams.length ? teams.map(function(t){
      return '<div class="turf"><div class="t"><b>' + esc(t.data.name) + '</b></div>' +
        '<button data-lead="' + t.id + '">Leader link</button><button data-tlink="' + t.id + '">Team link</button><button data-del="' + t.id + '">✕</button></div>';
    }).join('') : '<div class="empty">No leaders yet.</div>';
    // the current outreach: every door marked while it is set carries its name
    var cc = items.campaign && !items.campaign.deleted ? items.campaign.data : {};
    h += '<label>Current outreach</label>' + (cc.name ? '<div class="empty" style="font-size:13.5px">Since ' + when(cc.since) + ', set by ' + esc(cc.by || '') + '</div>' : '') +
      '<div style="display:flex; gap:8px"><input type="text" id="campName" placeholder="e.g. Fall revival" value="' + esc(cc.name || '') + '" style="flex:1">' +
      '<button id="campSave" class="qd">Set</button>' + (cc.name ? '<button id="campEnd" class="qd">End</button>' : '') + '</div>';
    h += '<label>Add a leader</label><input type="text" id="newLead" placeholder="e.g. Bro Paul">';
    h += '<div class="acts"><button id="tsBack">Back</button><button class="save" id="tsAdd">Add</button></div>';
    h += '<label>Your pastor link</label><div class="empty">Only for you and the pastor. It sees every team.</div>' +
         '<div class="acts" style="margin-top:6px"><button id="tsPastor">Send pastor link</button></div>';
    openSheet(h);
    $('tsBack').addEventListener('click', function(){ repTeam = null; report(); });
    function setCampaign(name){
      var cur = items.campaign && !items.campaign.deleted ? items.campaign.data : {}, now = Date.now();
      var past = (cur.past || []).slice();
      if (cur.name) past.push({ name:cur.name, from:cur.since, to:now, by:cur.by });
      save({ id:'campaign', kind:'meta', data:{ name:name, since:now, by:myName, past:past.slice(-50) } });
      track(name ? 'campaign.set' : 'campaign.end', { name:name || cur.name || '' });
      teamsSetup();
    }
    $('campSave').addEventListener('click', function(){ var n = $('campName').value.trim(); if (n) setCampaign(n); });
    if ($('campEnd')) $('campEnd').addEventListener('click', function(){ if (confirm('End the current outreach?')) setCampaign(''); });
    $('tsAdd').addEventListener('click', function(){
      var n = $('newLead').value.trim(); if (!n) return $('newLead').focus();
      save({ id:'tm' + rid(10), kind:'team', data:{ name:n, leaderKey:rid(12), addedBy:myName, addedAt:Date.now() } });
      track('team.add', { name:n });
      teamsSetup();
    });
    $('tsPastor').addEventListener('click', function(){ shareUrl(BASE + '&p=' + myPastor, 'Door knocking, pastor link', 'Pastor link copied.', 'pastor',
      'The pastor link for door knocking. It sees every team and adds the leaders. Keep it private.'); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lead]'), function(b){
      b.addEventListener('click', function(){ var t = items[b.dataset.lead];
        shareUrl(leaderLink(t), 'Door knocking, ' + t.data.name, 'Leader link for ' + t.data.name + ' copied. Send it to them only.', 'leader:' + t.data.name,
          t.data.name + ', this is your LEADER link for door knocking. Keep it to yourself; use Invite team inside it to bring your people in.'); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tlink]'), function(b){
      b.addEventListener('click', function(){ var t = items[b.dataset.tlink];
        shareUrl(teamLink(t), 'Door knocking, ' + t.data.name + '\'s team', 'Team link for ' + t.data.name + ' copied.', 'invite:' + t.data.name,
          'Door knocking with ' + t.data.name + '\'s team. Tap to open the map, then put in your name.'); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){ var t = JSON.parse(JSON.stringify(items[b.dataset.del]));
        if (!confirm('Remove ' + t.data.name + ' as a leader? Doors their team marked stay on the map.')) return;
        t.data.removedBy = myName; t.data.removedAt = Date.now();
        t.deleted = true; save(t); track('team.remove', { name:t.data.name }); teamsSetup(); });
    });
  }
  // ---- search (leaders and the pastor) ---------------------------------------------
  // "We knocked a Sarah, which door was it?" Searches the address, the note, every
  // OLD note in the history (a note somebody wrote over still counts), who
  // knocked it and their team. Every word typed has to be found somewhere.
  var mapFilter = null;                                   // pin id -> 1 while results are shown on the map
  var sq = { q:'', st:{}, week:false, team:false };       // kept so reopening search restores it
  function hay(p){
    var d = p.data, parts = [d.addr, d.note, d.who, d.contact && d.contact.name, d.contact && d.contact.phone, d.contact && String(d.contact.phone || '').replace(/[^0-9]/g, '')];
    (d.log || []).forEach(function(l){ parts.push(l.note, l.addr, l.who, l.team ? teamName(l.team) : '', l.camp, l.contact && l.contact.name, l.contact && l.contact.phone); });
    return parts.filter(Boolean).join(' \n ').toLowerCase();
  }
  function searchPins(){
    var words = sq.q.toLowerCase().split(/\s+/).filter(Boolean);
    var wk = weekStart(Date.now()), anySt = Object.keys(sq.st).some(function(k){ return sq.st[k]; });
    return live('pin').filter(function(p){
      if (anySt && !sq.st[p.data.status]) return false;
      if (sq.week && !(p.data.log || []).some(function(l){ return l.at >= wk; })) return false;
      if (sq.team && !(p.data.log || []).some(function(l){ return l.team === myTeam; })) return false;
      if (!words.length) return true;
      var h = hay(p);
      return words.every(function(w){ return h.indexOf(w) >= 0; });
    }).sort(function(a, b){ return (b.data.at || 0) - (a.data.at || 0); });
  }
  function hl(text, words){
    var t = esc(text);
    words.forEach(function(w){
      var e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (e) t = t.replace(new RegExp('(' + e + ')', 'ig'), '<mark>$1</mark>');
    });
    return t;
  }
  // the line that explains WHY a house came up: the note that holds the word
  function why(p, words){
    if (!words.length) return p.data.note ? { old:false, text:p.data.note } : null;
    var notes = [p.data.note].concat((p.data.log || []).map(function(l){ return l.note; }).reverse()).filter(Boolean);
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i].toLowerCase();
      if (words.some(function(w){ return n.indexOf(w) >= 0; })) return { old:!!i && notes[i] !== p.data.note, text:notes[i] };
    }
    return p.data.note ? { old:false, text:p.data.note } : null;
  }
  function resultsHtml(list){
    var words = sq.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!list.length) return '<div class="empty">No houses match.</div>';
    return list.slice(0, 150).map(function(p){
      var d = p.data, s = STAT[d.status] || STAT.noans, w = why(p, words);
      return '<div class="rrow tap" data-pin="' + p.id + '"><span class="dot" style="background:' + s.color + '"></span><div class="n">' +
        hl(d.addr || 'No address', words) + '<span>' + s.label + ' · ' + hl(d.who || '', words) + ' · ' + when(d.at) +
        (w ? '\n' + (w.old ? 'Earlier note ' : '') + '“' + hl(w.text, words) + '”' : '') + '</span></div></div>';
    }).join('') + (list.length > 150 ? '<div class="empty">Showing the newest 150. Type more to narrow it.</div>' : '');
  }
  function searchSheet(){
    var h = '<h3>Search houses</h3><input type="text" id="sq" placeholder="A name, street, phone, or who knocked" value="' + esc(sq.q) + '" autocomplete="off">';
    h += '<div class="fchips">' + STATUSES.map(function(s){
      return '<button data-st="' + s.k + '" class="' + (sq.st[s.k] ? 'on' : '') + '"><span class="dot" style="background:' + s.color + '"></span>' + s.label + '</button>';
    }).join('') + '<button data-f="week" class="' + (sq.week ? 'on' : '') + '">This week</button>' +
      (teamOf(myTeam) ? '<button data-f="team" class="' + (sq.team ? 'on' : '') + '">' + esc(teamName(myTeam)) + '</button>' : '') + '</div>';
    h += '<div class="sub" id="sCount" style="margin:8px 0 2px"></div><div id="sRes"></div>';
    h += '<div class="acts"><button id="sClose">Close</button><button class="save" id="sMap">Show on map</button></div>';
    openSheet(h);
    function run(){
      var list = searchPins();
      $('sCount').textContent = list.length === 1 ? '1 house' : list.length + ' houses';
      $('sRes').innerHTML = resultsHtml(list);
      Array.prototype.forEach.call(document.querySelectorAll('#sRes [data-pin]'), function(r){
        r.addEventListener('click', function(){ var p = items[r.dataset.pin]; closeSheet(); map.setView([p.data.lat, p.data.lng], 19); openPin(p.id); });
      });
      return list;
    }
    run();
    var sqT = null;
    $('sq').addEventListener('input', function(){ sq.q = this.value; run();
      clearTimeout(sqT); sqT = setTimeout(function(){ if (sq.q.trim().length >= 2) track('search.houses', { q:sq.q.trim(), found:searchPins().length }); }, 1500); });
    Array.prototype.forEach.call(document.querySelectorAll('.fchips button'), function(b){
      b.addEventListener('click', function(){
        if (b.dataset.st) sq.st[b.dataset.st] = !sq.st[b.dataset.st];
        else sq[b.dataset.f] = !sq[b.dataset.f];
        b.classList.toggle('on'); run();
      });
    });
    $('sClose').addEventListener('click', closeSheet);
    $('sMap').addEventListener('click', function(){
      var list = run();
      if (!list.length) return;
      mapFilter = {}; list.forEach(function(p){ mapFilter[p.id] = 1; });
      closeSheet();
      map.fitBounds(L.latLngBounds(list.map(function(p){ return [p.data.lat, p.data.lng]; })), { padding:[60,60], maxZoom:19 });
      reopenList = searchSheet;
      showFbar(list.length);
    });
    if (!sq.q) setTimeout(function(){ var el = $('sq'); if (el) el.focus(); }, 60);
  }
  function showFbar(n, from){
    $('fbarText').textContent = 'Showing ' + (n === 1 ? '1 house' : n + ' houses') + ' · ' + (from || 'your search');
    render();
  }
  $('fbarClear').addEventListener('click', function(){ mapFilter = null; render(); });
  $('fbarList').addEventListener('click', function(){ (reopenList || searchSheet)(); });
  $('searchBtn').addEventListener('click', searchSheet);

  // ---- find an address or place, for everyone ----------------------------------
  // "I had to scroll to find where we are today." Esri's search (the same company
  // as the satellite photos) knows house numbers and business names and is
  // biased to wherever the map is pointed, so "100 Heathwood" finds the one in
  // Broussard first. Photon (OpenStreetMap) is the backup if Esri cannot be
  // reached; it knows places but often only the street, not the house.
  // Results only move the map, nothing is stored, which is what anonymous Esri
  // search allows.
  var ESRI = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/';
  var placeRing = null, placeSeq = 0;
  function flyTo(lat, lng){
    closeSheet();
    map.setView([lat, lng], 18);
    if (placeRing) map.removeLayer(placeRing);
    placeRing = L.circleMarker([lat, lng], { radius:22, weight:4, color:'#1f4fd1', dashArray:'6 6', fill:false, interactive:false }).addTo(map);
    setTimeout(function(){ if (placeRing) { map.removeLayer(placeRing); placeRing = null; } }, 10000);
  }
  function esriFind(q, c){
    return fetch(ESRI + 'suggest?f=json&countryCode=USA&maxSuggestions=8&text=' + encodeURIComponent(q) + '&location=' + c.lng.toFixed(4) + ',' + c.lat.toFixed(4))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.suggestions) throw new Error('esri');
        return j.suggestions.map(function(x){
          var parts = x.text.replace(/, USA$/, '').split(', ');
          return { l1:parts[0], l2:parts.slice(1).join(', '), go:function(){
            fetch(ESRI + 'findAddressCandidates?f=json&maxLocations=1&SingleLine=' + encodeURIComponent(x.text) + '&magicKey=' + encodeURIComponent(x.magicKey))
              .then(function(r){ return r.json(); })
              .then(function(k){ var g = k.candidates && k.candidates[0]; if (g) flyTo(g.location.y, g.location.x); else alert('Could not find that spot.'); })
              .catch(function(){ alert('Could not reach the map search. Check the signal and try again.'); });
          } };
        });
      });
  }
  function photonFind(q, c){
    return fetch('https://photon.komoot.io/api/?limit=8&lang=en&q=' + encodeURIComponent(q) + '&lat=' + c.lat.toFixed(4) + '&lon=' + c.lng.toFixed(4))
      .then(function(r){ return r.json(); })
      .then(function(j){
        return (j.features || []).filter(function(x){ return !x.properties.countrycode || x.properties.countrycode === 'US'; }).map(function(x){
          var pr = x.properties, st = [pr.housenumber, pr.street].filter(Boolean).join(' ');
          var g = x.geometry.coordinates;
          return { l1:pr.name || st, l2:[pr.name ? st : '', pr.city || pr.county, pr.state].filter(Boolean).join(', '), go:function(){ flyTo(g[1], g[0]); } };
        });
      });
  }
  function gotoSheet(){
    var h = '<h3>Find an address or place</h3><input type="text" id="gq" placeholder="e.g. 418 Albertson Pkwy, or Camelot of Broussard" autocomplete="off">' +
      '<div id="gRes" style="margin-top:6px"></div><div class="acts"><button id="gClose">Close</button></div>';
    openSheet(h);
    var el = $('gq'), t = null;
    setTimeout(function(){ el.focus(); }, 60);
    function show(list, mine){
      if (mine !== placeSeq || !$('gRes')) return;
      $('gRes').innerHTML = list.length ? list.map(function(x, i){
        return '<div class="rrow tap" data-g="' + i + '"><span style="font-size:17px">📍</span><div class="n">' + esc(x.l1) +
          (x.l2 ? '<span>' + esc(x.l2) + '</span>' : '') + '</div><div class="c">›</div></div>';
      }).join('') : '<div class="empty">Nothing found. Try the street address.</div>';
      Array.prototype.forEach.call(document.querySelectorAll('#gRes [data-g]'), function(r){
        r.addEventListener('click', function(){ var x = list[+r.dataset.g]; track('search.place', { q:el.value.trim(), picked:x.l1 + (x.l2 ? ', ' + x.l2 : '') }); x.go(); });
      });
    }
    function run(){
      var q = el.value.trim(), mine = ++placeSeq, c = map.getCenter();
      if (q.length < 3) { $('gRes').innerHTML = ''; return; }
      $('gRes').innerHTML = '<div class="empty">Searching…</div>';
      esriFind(q, c).catch(function(){ return photonFind(q, c); })
        .then(function(list){ show(list, mine); })
        .catch(function(){ if (mine === placeSeq && $('gRes')) $('gRes').innerHTML = '<div class="empty">Could not search right now. Check the signal and try again.</div>'; });
    }
    el.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(run, 300); });
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter') { clearTimeout(t); run(); } });
    $('gClose').addEventListener('click', closeSheet);
  }
  $('goto').addEventListener('click', gotoSheet);

  $('reportBtn').addEventListener('click', function(){
    repTeam = isPastor() ? null : myTeam; report();
    track('report.view', { team:repTeam == null ? '*' : repTeam });
    loadTurfs().then(function(added){ if (added && sheetOpen && document.querySelector('#sheet .wk')) report(); });
  });

  // ---- locate + layer ----------------------------------------------------------------
  // The map opens where you are standing, and the blue dot follows you as you
  // walk. Only if the phone will not say where you are does it open on the
  // houses already marked instead.
  var meDot = null, myLL = null, located = false, locFailed = false, fitted = false;
  var myPos = null;   // the last fix: where the phone is, how sure, when
  function showMe(pos){
    myLL = [pos.coords.latitude, pos.coords.longitude];
    myPos = { lat:myLL[0], lng:myLL[1], acc:Math.round(pos.coords.accuracy || 0), t:Date.now() };
    if (meDot) meDot.setLatLng(myLL);
    else meDot = L.circleMarker(myLL, { radius:7, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1, interactive:false }).addTo(map);
    if (!located && !fitted) map.setView(myLL, 18);
    located = true;
  }
  function watchMe(){
    if (!navigator.geolocation) { locFailed = true; return fitPins(); }
    navigator.geolocation.watchPosition(showMe, function(){
      if (!located) { locFailed = true; fitPins(); }
    }, { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
  }
  function fitPins(){
    if (located || fitted) return;
    var pts = live('pin').map(function(p){ return [p.data.lat, p.data.lng]; });
    live('turf').forEach(function(t){ pts = pts.concat(t.data.pts); });
    if (pts.length) { fitted = true; map.fitBounds(L.latLngBounds(pts), { padding:[40,40], maxZoom:18 }); }
  }
  $('locate').addEventListener('click', function(){
    if (myLL) return map.setView(myLL, Math.max(map.getZoom(), 18));
    if (!navigator.geolocation) return alert('This phone cannot share its location.');
    navigator.geolocation.getCurrentPosition(function(pos){ showMe(pos); map.setView(myLL, 18); },
      function(){ alert('Could not get your location. Check that location is allowed for this site.'); },
      { enableHighAccuracy:true, timeout:10000, maximumAge:15000 });
  });
  $('layer').addEventListener('click', function(){
    map.removeLayer(useSat ? sat : street);
    useSat = !useSat;
    (useSat ? sat : street).addTo(map);
    localStorage.setItem('knock-layer', useSat ? 'sat' : 'street');
    setLayerIcon();
  });


  // ---- go ------------------------------------------------------------------------------
  map.setView([30.5044, -90.4612], 13);
  setLayerIcon();
  render();
  watchMe();
  refreshHouses();

  // 🔴 GitHub Pages lets a phone keep the page for 10 minutes, so right after an
  // update Lizzy opened a new link with the OLD page, which could not read it and
  // started a blank map. On every open, ask for the newest copy past every cache;
  // if it is newer, load it under a fresh address (a cache cannot answer that),
  // once per version so a stale server can never loop it.
  var MY_VER = document.querySelector('meta[name="x-knock-version"]').content;
  function checkVersion(){
    fetch(location.pathname + '?vcheck=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var v = /x-knock-version" content="([^"]+)"/.exec(html);
        if (!v || v[1] === MY_VER) return;
        if (sessionStorage.getItem('knock-upd-' + v[1])) return;
        sessionStorage.setItem('knock-upd-' + v[1], '1');
        var q = new URLSearchParams(location.search); q.set('v', v[1]);
        location.replace(location.pathname + '?' + q.toString() + location.hash);
      }).catch(function(){});
  }
  checkVersion();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkVersion(); });
  pull(); flush();
  setInterval(function(){ if (!document.hidden) { pull(); flush(); flushEvents(); } }, 8000);
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { hiddenAt = Date.now(); return; }
    pull(); flush(); flushEvents();
    if (hiddenAt && Date.now() - hiddenAt > 10 * 60e3) track('open', { v:MY_VER, back:true, away:Math.round((Date.now() - hiddenAt) / 60e3) });
  });
  window.addEventListener('online', flush);
  if (!myName) askName();
})();
</script>
